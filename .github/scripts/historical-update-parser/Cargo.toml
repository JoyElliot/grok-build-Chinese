[package]
name = "historical-community-parser-compatibility"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
flate2 = { version = "=1.1.5", default-features = false, features = ["zlib-rs"] }
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = { version = "=0.10.9", features = ["force-soft"] }
tar = "=0.4.46"
zip = { version = "=3.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.27.0"
