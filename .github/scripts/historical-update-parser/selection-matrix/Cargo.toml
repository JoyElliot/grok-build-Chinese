[package]
name = "exact-updater-selection-matrix"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
semver = "=1.0.28"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = { version = "=0.10.9", features = ["force-soft"] }
zip = { version = "=3.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "=3.27.0"
