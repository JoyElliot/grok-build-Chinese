name: Upstream 1.0.35 review inputs
on:
  push:
    branches: [sync/upstream-1.0.35]
    paths: [.github/workflows/upstream-review-inputs-135.yml]
permissions:
  contents: read
jobs:
  inputs:
    if: github.repository == 'JoyElliot/grok-build-Chinese' && github.ref == 'refs/heads/sync/upstream-1.0.35'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Export fixed public Git history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-135"
          cd "$RUNNER_TEMP/review-135"
          git clone --no-checkout https://github.com/JoyElliot/grok-build-Chinese.git fork
          cd fork
          git fetch https://github.com/xai-org/grok-build.git a28ee2b2063426e8816e380ccea528b9de95e5da
          git branch review-upstream FETCH_HEAD
          git branch review-base 50f53f06bab8309cb8299a50cd2751deb26db726
          git checkout --detach review-base
          git bundle create ../source.bundle --all
          git worktree add --detach ../upstream review-upstream
          sha256sum ../source.bundle
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-135-source-${{ github.run_id }}
          path: ${{ runner.temp }}/review-135/source.bundle
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Prepare fixed Rust compiler and native tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component rustfmt
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends protobuf-compiler libprotobuf-dev libprotoc-dev libssl-dev libdbus-1-dev libasound2-dev libclang-dev cmake pkg-config nasm
          out="$RUNNER_TEMP/review-135/tooling"
          mkdir -p "$out/sysroot" "$out/native"
          root=$(rustc +1.94.0 --print sysroot)
          cp -a "$root/." "$out/sysroot/"
          for pkg in protobuf-compiler libprotobuf-dev libprotoc-dev libprotobuf23 libprotoc23 libssl-dev libssl3 libdbus-1-dev libdbus-1-3 libasound2-dev libasound2 libclang-14-dev libclang1-14 libclang-common-14-dev libllvm14; do
            dpkg-query -L "$pkg" 2>/dev/null | while IFS= read -r file; do
              if [[ -f "$file" || -L "$file" ]]; then
                cp -a --parents "$file" "$out/native/"
              fi
            done
          done
          tar -C "$RUNNER_TEMP/review-135" -czf "$RUNNER_TEMP/review-135/tooling.tar.gz" tooling
          sha256sum "$RUNNER_TEMP/review-135/tooling.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-135-tooling-${{ github.run_id }}
          path: ${{ runner.temp }}/review-135/tooling.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
      - name: Vendor both fixed dependency graphs
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.94.0
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/review-135/fork"
          cargo vendor --locked --versioned-dirs --sync "$RUNNER_TEMP/review-135/upstream/Cargo.toml" "$RUNNER_TEMP/review-135/vendor" > ../vendor-config.toml
          tar -C .. -czf "$RUNNER_TEMP/review-135/vendor.tar.gz" vendor vendor-config.toml
          sha256sum "$RUNNER_TEMP/review-135/vendor.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: review-135-vendor-${{ github.run_id }}
          path: ${{ runner.temp }}/review-135/vendor.tar.gz
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
