name: CI

on:
  push:
    branches:
      - zh-dev
      - codex/free-account-localization-macos-smoke
    paths-ignore:
      - community/announcements/**
      - community/display-translations/**
  pull_request:
    branches:
      - zh-dev
    paths-ignore:
      - community/announcements/**
      - community/display-translations/**
  workflow_dispatch:
    inputs:
      version:
        description: 可选的内嵌版本（默认为 CI 构建编号）
        required: false
        type: string
      macos_build_variant:
        description: macOS 构建对照；不改变正式发布配置
        required: false
        type: choice
        default: current
        options:
          - current
          - thin-lto

permissions:
  contents: read

concurrency:
  # Every push, PR update and manual run can finish independently.
  group: zh-dev-multiplatform-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  rust-format-preflight:
    name: Rust 格式预检
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: 1.94.0-x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: 安装固定版本 rustfmt
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt
      - name: 在六平台编译前检查全仓格式
        run: cargo fmt --all -- --check

  windows-gnu-rust-validation:
    name: Windows GNU 测试 (${{ matrix.suite }})
    needs: rust-format-preflight
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        suite: [core, ui]
    env:
      CARGO_BUILD_JOBS: "4"
      # Test assertions remain enabled; omit workspace line-table debug info in CI.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_CACHE_SCHEMA: v2
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RUSTUP_TOOLCHAIN: 1.94.0-x86_64-pc-windows-gnu
      TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: 验证安装器、协议及工作流门禁
        if: matrix.suite == 'core'
        timeout-minutes: 15
        shell: pwsh
        run: ./.github/scripts/check-windows-package.ps1 -Mode preview
      - name: 准备 Windows GNU 测试环境
        uses: ./.github/actions/setup-windows-gnu
        with:
          version: ${{ inputs.version }}
      - name: 运行独立测试分片
        uses: ./.github/actions/validate-windows-gnu
        with:
          suite: ${{ matrix.suite }}
          mode: preview
          # Keep PR storage available for the slower production builds. Tests
          # still run after every restore; zh-dev refreshes the shared fallback.
          save-cache: ${{ github.ref == 'refs/heads/zh-dev' }}

  windows-gnu-validation:
    name: Windows x64 GNU 验证
    if: always()
    needs:
      - windows-gnu-rust-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检查所有验证分片
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'length > 0 and all(. == "success")' <<< "$RESULTS"

  windows-gnu-cross-build:
    name: Windows x64 GNU 交叉编译
    needs: rust-format-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      artifact_name: ${{ steps.build.outputs.artifact_name }}
      monitor_url: ${{ steps.build.outputs.monitor_url }}
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RUSTUP_TOOLCHAIN: 1.94.0-x86_64-unknown-linux-gnu
      TARGET: x86_64-pc-windows-gnu
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
      CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
      CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++
      AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: 在 Linux 宿主编译 Windows GNU
        id: build
        uses: ./.github/actions/build-windows-gnu-cross
        with:
          version: ${{ inputs.version }}

  windows-gnu-build:
    name: Windows x64 GNU 原生打包验证
    needs:
      - windows-gnu-cross-build
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_CACHE_SCHEMA: v2
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RESOURCE_SAMPLE_SECONDS: "5"
      RUSTUP_TOOLCHAIN: 1.94.0-x86_64-pc-windows-gnu
      TARGET: x86_64-pc-windows-gnu

    steps:
      - name: 检出 zh-dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 准备 Windows GNU 预览环境
        id: windows_setup
        uses: ./.github/actions/setup-windows-gnu
        with:
          version: ${{ inputs.version }}

      - name: 下载同轮 Linux 交叉编译输入
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.windows-gnu-cross-build.outputs.artifact_name }}
          path: ${{ runner.temp }}/grok-gnu-cross-input

      - name: 验证构建身份和 EXE 哈希
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputRoot = Join-Path $env:RUNNER_TEMP 'grok-gnu-cross-input'
          $metadata = Get-Content -LiteralPath (Join-Path $inputRoot 'build-input.json') -Raw | ConvertFrom-Json
          if ($metadata.commit -cne $env:GITHUB_SHA -or $metadata.version -cne $env:GROK_VERSION -or
              $metadata.target -cne $env:TARGET -or $metadata.profile -cne 'release-dist' -or
              $metadata.features -cne 'release-dist' -or $metadata.build_host -cne 'x86_64-unknown-linux-gnu') {
            throw '交叉编译输入与本轮提交、版本、目标或配置不一致。'
          }
          $sourceExe = Join-Path $inputRoot 'grok-zh.exe'
          if ($metadata.sha256 -notmatch '^[a-f0-9]{64}$' -or
              (Get-FileHash -LiteralPath $sourceExe -Algorithm SHA256).Hash -ine $metadata.sha256) {
            throw '交叉编译 EXE 哈希不一致。'
          }
          $targetRoot = Join-Path $env:CARGO_TARGET_DIR "$env:TARGET\release-dist"
          New-Item -ItemType Directory -Path $targetRoot -Force | Out-Null
          Copy-Item -LiteralPath $sourceExe -Destination (Join-Path $targetRoot 'grok-zh.exe')
          "BUILD_DURATION_SECONDS=$([int]$metadata.build_duration_seconds)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 打包未签名绿色预览版
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $package = Join-Path $dist $env:PACKAGE_NAME
          New-Item -ItemType Directory -Path $package -Force | Out-Null

          $builtExe = Join-Path $env:CARGO_TARGET_DIR "$env:TARGET\release-dist\grok-zh.exe"
          if (!(Test-Path -LiteralPath $builtExe)) {
            throw "缺少构建出的可执行文件：$builtExe"
          }
          $packageExe = Join-Path $package 'grok-zh.exe'
          $symbolsRoot = Join-Path $env:RUNNER_TEMP 'grok-zh-windows-symbols'
          $objdump = 'C:\mingw64\bin\objdump.exe'
          $python = (Get-Command python -ErrorAction Stop).Source
          $savedPath = $env:PATH
          try {
            # A distributable EXE must run without a compiler runtime on PATH.
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            & $python .github/scripts/strip-windows-binary.py `
              --input $builtExe --output $packageExe --strip 'C:\mingw64\bin\strip.exe' `
              --preserve-mingw-write-permissions `
              --version $env:GROK_VERSION --symbols-dir $symbolsRoot
            if ($LASTEXITCODE -ne 0) {
              throw "EXE 精简及独立运行环境冒烟失败：$LASTEXITCODE"
            }
          } finally {
            $env:PATH = $savedPath
          }

          Copy-Item -LiteralPath 'packaging\windows\agent-zh.cmd' `
            -Destination (Join-Path $package 'agent-zh.cmd')
          Copy-Item -LiteralPath 'packaging\windows\一键安装.cmd' `
            -Destination (Join-Path $package '一键安装.cmd')
          Copy-Item -LiteralPath 'packaging\windows\[可选]替换原始启动方式.cmd' `
            -Destination (Join-Path $package '[可选]替换原始启动方式.cmd')
          Copy-Item -LiteralPath 'packaging\windows\Install-GrokZh.ps1' `
            -Destination (Join-Path $package 'Install-GrokZh.ps1')
          Copy-Item -LiteralPath 'packaging\windows\INSTALL-WINDOWS.md' `
            -Destination (Join-Path $package 'INSTALL-WINDOWS.md')

          $rgVersion = '15.1.0'
          $rgArchive = Join-Path $env:RUNNER_TEMP 'ripgrep.zip'
          $rgExtract = Join-Path $env:RUNNER_TEMP 'ripgrep'
          $rgUri = "https://github.com/BurntSushi/ripgrep/releases/download/$rgVersion/ripgrep-$rgVersion-x86_64-pc-windows-msvc.zip"
          $rgDownloadAttempts = 3
          for ($attempt = 1; $attempt -le $rgDownloadAttempts; $attempt++) {
            try {
              Invoke-WebRequest -Uri $rgUri -OutFile $rgArchive `
                -ConnectionTimeoutSeconds 120 -OperationTimeoutSeconds 120
              break
            } catch {
              if ($attempt -eq $rgDownloadAttempts) { throw }
              $retryDelay = 5 * $attempt
              Write-Warning "ripgrep 下载失败（第 $attempt 次），将在 $retryDelay 秒后重试：$($_.Exception.Message)"
              Start-Sleep -Seconds $retryDelay
            }
          }
          Expand-Archive -LiteralPath $rgArchive -DestinationPath $rgExtract
          $rgSource = Get-ChildItem -LiteralPath $rgExtract -Filter rg.exe -Recurse -File |
            Select-Object -First 1
          if (!$rgSource) {
            throw '下载的 ripgrep 压缩包不包含 rg.exe。'
          }
          $rgHash = (Get-FileHash -LiteralPath $rgSource.FullName -Algorithm SHA256).Hash
          if ($rgHash -ne 'DECDD4992F3F1B9A5EF9898F1B40AB16886D579D6516B4EFD3D5EAA19364E408') {
            throw "ripgrep SHA-256 校验值异常：$rgHash"
          }
          Copy-Item -LiteralPath $rgSource.FullName -Destination (Join-Path $package 'rg.exe')

          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $package 'LICENSE-grok-build.txt')
          $licenseRoot = Join-Path $package 'licenses'
          $rgLicenseDir = Join-Path $licenseRoot 'ripgrep'
          $projectNoticeDir = Join-Path $licenseRoot 'project'
          New-Item -ItemType Directory -Path $rgLicenseDir,$projectNoticeDir -Force | Out-Null
          foreach ($licenseName in @('COPYING', 'LICENSE-MIT', 'UNLICENSE')) {
            $license = Get-ChildItem -LiteralPath $rgExtract -Filter $licenseName -Recurse -File |
              Select-Object -First 1
            if (!$license) {
              throw "下载的 ripgrep 压缩包缺少许可证文件：$licenseName"
            }
            Copy-Item -LiteralPath $license.FullName -Destination $rgLicenseDir
          }
          Copy-Item -LiteralPath 'THIRD-PARTY-NOTICES' -Destination $projectNoticeDir
          Copy-Item -LiteralPath 'crates\codegen\xai-grok-tools\THIRD_PARTY_NOTICES.md' `
            -Destination $projectNoticeDir
          Copy-Item -LiteralPath 'third_party\NOTICE' -Destination $projectNoticeDir

          $signature = (Get-AuthenticodeSignature -LiteralPath $packageExe).Status
          $pe = (& $objdump -f $packageExe | Select-String 'file format').Line.Trim()
          @"
          Grok Build 简体中文 CI 预览版
          Version: $env:GROK_VERSION
          Commit: $env:GITHUB_SHA
          Target: $env:TARGET
          Build host: x86_64-unknown-linux-gnu; validated natively on Windows x64
          Profile: release-dist (Thin LTO, opt-level=3, codegen-units=1, debug=0; release-dist features)
          Symbols: stripped; runtime PE sections verified unchanged
          PE: $pe
          Authenticode: $signature
          Executable smoke-tested by CI: true (--version, --help, agent --help, update --help)
          Default commands after installation: grok-zh, agent-zh
          Optional command takeover: grok, agent
          "@.Trim() | Set-Content -LiteralPath (Join-Path $package 'BUILD-INFO.txt') -Encoding utf8
          python .github/scripts/write-package-protocol.py --package $package --version $env:GROK_VERSION --platform $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw '生成包内更新协议失败。' }

          $manifestNames = @(
            'grok-zh.exe',
            'agent-zh.cmd',
            'rg.exe',
            '一键安装.cmd',
            '[可选]替换原始启动方式.cmd',
            'Install-GrokZh.ps1',
            'INSTALL-WINDOWS.md',
            'LICENSE-grok-build.txt',
            'BUILD-INFO.txt',
            'licenses/ripgrep/COPYING',
            'licenses/ripgrep/LICENSE-MIT',
            'licenses/ripgrep/UNLICENSE',
            'licenses/project/THIRD-PARTY-NOTICES',
            'licenses/project/THIRD_PARTY_NOTICES.md',
            'licenses/project/NOTICE'
          )
          $manifestLines = foreach ($name in $manifestNames) {
            $path = Join-Path $package $name
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            "$hash  $name"
          }
          $manifestLines | Set-Content `
            -LiteralPath (Join-Path $package 'SHA256SUMS.txt') -Encoding utf8

          $topLevelEntries = @(Get-ChildItem -LiteralPath $dist -Force)
          if ($topLevelEntries.Count -ne 1 -or !$topLevelEntries[0].PSIsContainer) {
            throw 'dist 必须只包含一个解压后的软件包目录。'
          }
          if (Get-ChildItem -LiteralPath $dist -Filter '*.zip' -Recurse -File) {
            throw '预览制品不得包含嵌套 ZIP 压缩包。'
          }
          "已准备解压后的软件包目录：$package"

      - name: 上传独立 Windows 符号诊断
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grok-zh-windows-symbols-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grok-zh-windows-symbols
          if-no-files-found: warn
          compression-level: 9
          retention-days: 14

      - name: 上传绿色预览版
        id: preview_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grok-zh-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ steps.windows_setup.outputs.package_name }}
          if-no-files-found: error
          compression-level: 9
          retention-days: 7

      - name: 在摘要中发布制品详情
        shell: pwsh
        env:
          PREVIEW_URL: ${{ steps.preview_artifact.outputs.artifact-url }}
          PREVIEW_DIGEST: ${{ steps.preview_artifact.outputs.artifact-digest }}
          MONITOR_URL: ${{ needs.windows-gnu-cross-build.outputs.monitor_url }}
        run: |
          @"
          ## Windows GNU 原生产物验收

          - 完整验收同时要求交叉编译、Windows 原生测试和本原生产物验证成功。
          - 版本：``$env:GROK_VERSION``
          - 制品：[$env:PACKAGE_NAME]($env:PREVIEW_URL)
          - 制品 SHA-256：``$env:PREVIEW_DIGEST``
          - 编译宿主：Linux x64；目标：``$env:TARGET``
          - Cargo 构建耗时：``$env:BUILD_DURATION_SECONDS`` 秒
          - [Cargo timings、工具链及宿主资源记录]($env:MONITOR_URL)
          - Windows 原生 PE 运行节保护、符号处理及隔离 CLI 冒烟通过。
          - 安装包布局、哈希与更新协议保持原约定。
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # Keep the existing Windows check as the acceptance gate for both runners.
  windows-gnu-preview:
    name: Windows x64 GNU 预览版
    if: ${{ always() }}
    needs:
      - windows-gnu-validation
      - windows-gnu-build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VALIDATION_RESULT: ${{ needs.windows-gnu-validation.result }}
      BUILD_RESULT: ${{ needs.windows-gnu-build.result }}
    steps:
      - name: 验证 Windows 测试与编译均成功
        shell: bash
        run: |
          set -euo pipefail
          printf 'Windows validation: %s\nWindows build: %s\n' \
            "${VALIDATION_RESULT}" "${BUILD_RESULT}"
          if [[ "${VALIDATION_RESULT}" != success || "${BUILD_RESULT}" != success ]]; then
            echo '::error::Windows 测试或编译未成功。'
            exit 1
          fi
          {
            echo '## Windows GNU 预览检查通过'
            echo
            echo '- 本地化、安装器与协议验证：成功'
            echo '- 产物编译与打包：成功'
            echo '- Linux 交叉编译、Windows 原生产物验证、Windows core/ui 原生测试均已通过。'
          } >> "${GITHUB_STEP_SUMMARY}"

  native-rust-validation:
    name: 原生测试 (${{ matrix.label }})
    needs: rust-format-preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows ARM64 MSVC
            os: windows-11-vs2026-arm
            family: windows
            target: aarch64-pc-windows-msvc
            schema: windows-arm64-v1
            jobs: 4
          - label: Linux x64 GNU
            os: ubuntu-24.04
            family: linux
            target: x86_64-unknown-linux-gnu
            schema: linux-x64-v1
            jobs: 3
            dotslash_sha256: 7400dd0dbdf05d3be4e604b62807eb1bcbaa0d1bced010d30746243759e0ac03
          - label: Linux ARM64 GNU
            os: ubuntu-24.04-arm
            family: linux
            target: aarch64-unknown-linux-gnu
            schema: linux-arm64-v1
            jobs: 3
            dotslash_sha256: 6e358adfd2125ab3f49967107a60a2683231d4f07f0e136735328fa1f21809b2
          - label: macOS ARM64
            os: macos-15
            family: macos
            target: aarch64-apple-darwin
            schema: macos-arm-v1
            jobs: 3
          - label: macOS Intel
            os: macos-15-intel
            family: macos
            target: x86_64-apple-darwin
            schema: macos-intel-v1
            jobs: 4
    env:
      CARGO_BUILD_JOBS: ${{ matrix.jobs }}
      # Keep test assertions/overflow checks; omit line-table debug information.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_CACHE_SCHEMA: ${{ matrix.schema }}
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      DOTSLASH_VERSION: "0.5.9"
      DOTSLASH_SHA256: ${{ matrix.dotslash_sha256 }}
      RUSTUP_TOOLCHAIN: 1.94.0-${{ matrix.target }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: Windows ARM64 原生测试
        if: matrix.family == 'windows'
        uses: ./.github/actions/build-windows-arm
        with:
          version: ${{ inputs.version }}
          release_build: 'false'
          phase: test
      - name: Linux 原生测试
        if: matrix.family == 'linux'
        uses: ./.github/actions/build-linux-x64
        with:
          version: ${{ inputs.version }}
          release_build: 'false'
          phase: test
      - name: macOS 原生测试
        if: matrix.family == 'macos'
        uses: ./.github/actions/build-macos-arm
        with:
          version: ${{ inputs.version }}
          release_build: 'false'
          phase: test

  windows-arm64-msvc-preview:
    name: Windows ARM64 MSVC 预览版
    needs: rust-format-preflight
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 240
    outputs:
      package_name: ${{ steps.build.outputs.package_name }}
      archive_name: ${{ steps.build.outputs.archive_name }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_CACHE_SCHEMA: windows-arm64-v1
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RUSTUP_TOOLCHAIN: 1.94.0-aarch64-pc-windows-msvc
      TARGET: aarch64-pc-windows-msvc
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 构建并验证 Windows ARM64 MSVC
        id: build
        uses: ./.github/actions/build-windows-arm
        with:
          version: ${{ inputs.version }}
          release_build: 'false'
          phase: build

  windows-msvc-migration-test:
    name: Windows x64 MSVC 更新器原生测试
    needs: rust-format-preflight
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_CACHE_SCHEMA: windows-x64-msvc-v1
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RUSTUP_TOOLCHAIN: 1.94.0-x86_64-pc-windows-msvc
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/build-windows-msvc-x64
        with:
          version: '1.0.99'
          release_build: 'false'
          phase: test

  windows-msvc-migration-experiment:
    name: Windows GNU 到 MSVC 真实产物迁移试验
    needs: rust-format-preflight
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_CACHE_SCHEMA: windows-x64-msvc-v1
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RUSTUP_TOOLCHAIN: 1.94.0-x86_64-pc-windows-msvc
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: 构建兼容入口并先检查迁移契约
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gcc = 'C:\mingw64\bin\gcc.exe'
          if (!(Test-Path -LiteralPath $gcc)) { throw 'runner 缺少 MinGW C 编译器。' }
          python -B .github/scripts/build-windows-migration-bootstrap.py --output migration-dist --version 1.0.99 --migration-tag migration-windows-x64-v1 --cc $gcc
          if ($LASTEXITCODE -ne 0) { throw '迁移启动器构建失败。' }
          python -B .github/scripts/tests/test_migration_package.py
          if ($LASTEXITCODE -ne 0) { throw '迁移打包契约失败。' }
          & ./packaging/windows/tests/Test-WindowsMigration.ps1 -ArtifactsDirectory "$PWD/migration-dist" -Gcc $gcc
          if (!$?) { throw 'PowerShell 7 迁移契约失败。' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/tests/Test-WindowsMigration.ps1 -ArtifactsDirectory "$PWD/migration-dist" -Gcc $gcc
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 迁移契约失败。' }
      - name: 构建原生 x64 MSVC 实际产品（隔离试验版本，不发布）
        id: build
        uses: ./.github/actions/build-windows-msvc-x64
        with:
          version: '1.0.99'
          release_build: 'false'
          phase: build
      - name: 旧版 EXE 替换边界到实际 MSVC 产品的完整迁移
        shell: pwsh
        env:
          PAYLOAD_PACKAGE: ${{ steps.build.outputs.package_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $gcc = 'C:\mingw64\bin\gcc.exe'
          python -B .github/scripts/build-windows-migration-bootstrap.py --output migration-dist --version 1.0.99 --migration-tag migration-windows-x64-v1 --cc $gcc --payload-package "dist/$env:PAYLOAD_PACKAGE"
          if ($LASTEXITCODE -ne 0) { throw 'GNU 兼容 ZIP 构建失败。' }
          & ./packaging/windows/tests/Test-MigrationProduct.ps1 -ArtifactsDirectory "$PWD/migration-dist" -PackageDirectory "$PWD/dist/$env:PAYLOAD_PACKAGE" -Gcc $gcc
          if (!$?) { throw 'PowerShell 7 实际产品迁移失败。' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/windows/tests/Test-MigrationProduct.ps1 -ArtifactsDirectory "$PWD/migration-dist" -PackageDirectory "$PWD/dist/$env:PAYLOAD_PACKAGE" -Gcc $gcc
          if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 实际产品迁移失败。' }
          @'
          ## Windows GNU → MSVC 迁移试验通过

          - 使用本轮真实 MSVC release-dist 产物；原 GNU 六平台产物和测试保留。
          - 已验证旧版只安装 EXE、纯版本检查、首次按需迁移和四类 CLI；后续启动不重复下载。
          - GitHub 请求使用测试内嵌传输，不需要创建正式 Release；生产入口没有 URL/信任绕过开关。
          - 1.0.99 仅为迁移协议测试版本。固定 helper 尚未发布，禁止分发此兼容入口给用户。
          '@ | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  linux-x64-gnu-preview:
    name: Linux x64 GNU 预览版
    needs: rust-format-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      package_name: ${{ steps.build.outputs.package_name }}
      archive_name: ${{ steps.build.outputs.archive_name }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_CACHE_SCHEMA: linux-x64-v1
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      DOTSLASH_VERSION: "0.5.9"
      DOTSLASH_SHA256: 7400dd0dbdf05d3be4e604b62807eb1bcbaa0d1bced010d30746243759e0ac03
      RUSTUP_TOOLCHAIN: 1.94.0-x86_64-unknown-linux-gnu
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 构建并验证 Linux x64 GNU
        id: build
        uses: ./.github/actions/build-linux-x64
        with:
          version: ${{ inputs.version }}
          release_build: 'false'
          phase: build

  linux-arm64-gnu-preview:
    name: Linux ARM64 GNU 预览版
    needs: rust-format-preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    outputs:
      package_name: ${{ steps.build.outputs.package_name }}
      archive_name: ${{ steps.build.outputs.archive_name }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_CACHE_SCHEMA: linux-arm64-v1
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      DOTSLASH_VERSION: "0.5.9"
      DOTSLASH_SHA256: 6e358adfd2125ab3f49967107a60a2683231d4f07f0e136735328fa1f21809b2
      RUSTUP_TOOLCHAIN: 1.94.0-aarch64-unknown-linux-gnu
      TARGET: aarch64-unknown-linux-gnu
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 构建并验证 Linux ARM64 GNU
        id: build
        uses: ./.github/actions/build-linux-x64
        with:
          version: ${{ inputs.version }}
          release_build: 'false'
          phase: build

  macos-arm-preview:
    name: macOS ARM64 预览版
    needs: rust-format-preflight
    runs-on: macos-15
    timeout-minutes: 240
    outputs:
      package_name: ${{ steps.build.outputs.package_name }}
      archive_name: ${{ steps.build.outputs.archive_name }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_CACHE_SCHEMA: macos-arm-v1
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RUSTUP_TOOLCHAIN: 1.94.0-aarch64-apple-darwin
      TARGET: aarch64-apple-darwin
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 构建并验证 macOS ARM64
        id: build
        uses: ./.github/actions/build-macos-arm
        with:
          version: ${{ inputs.version }}
          release_build: 'false'
          phase: build
          build_variant: ${{ inputs.macos_build_variant || 'current' }}

  macos-intel-preview:
    name: macOS Intel 预览版
    needs: rust-format-preflight
    runs-on: macos-15
    timeout-minutes: 240
    outputs:
      version: ${{ steps.build.outputs.version }}
      package_name: ${{ steps.build.outputs.package_name }}
      archive_name: ${{ steps.build.outputs.archive_name }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_CACHE_SCHEMA: macos-intel-cross-v1
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RUSTUP_TOOLCHAIN: 1.94.0-aarch64-apple-darwin
      TARGET: x86_64-apple-darwin
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 在 Apple Silicon 上交叉构建并验证 macOS Intel
        id: build
        uses: ./.github/actions/build-macos-arm
        with:
          version: ${{ inputs.version }}
          release_build: 'false'
          phase: build
          cross_compile: 'true'

  macos-intel-native-smoke:
    name: macOS Intel 原生产物验证
    needs:
      - macos-intel-preview
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      GROK_VERSION: ${{ needs.macos-intel-preview.outputs.version }}
      PACKAGE_NAME: ${{ needs.macos-intel-preview.outputs.package_name }}
      ARCHIVE_NAME: ${{ needs.macos-intel-preview.outputs.archive_name }}
      MACOS_ARCH: x86_64
      MACOS_BINARY_ARCH: x86_64
      MACOS_VERIFY_MODE: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
      - name: 下载本轮 Intel 制品
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.macos-intel-preview.outputs.artifact_name }}
          path: ${{ runner.temp }}/grok-intel-native-artifact
      - name: 在 Intel runner 验证签名、CLI、包结构及二次安装
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == x86_64 ]]
          bash .github/scripts/verify-macos-package.sh \
            "${RUNNER_TEMP}/grok-intel-native-artifact/${ARCHIVE_NAME}"
          echo 'macOS Intel 原生签名、CLI、包结构与安装器验证通过。' >> "${GITHUB_STEP_SUMMARY}"

  macos-consumer-smoke:
    name: macOS 免费账号真机冒烟
    if: >-
      ${{ github.event_name == 'push'
          && github.repository == 'JoyElliot/grok-build-Chinese'
          && github.ref == 'refs/heads/codex/free-account-localization-macos-smoke' }}
    needs:
      - native-rust-validation
      - macos-arm-preview
    environment: macos-consumer-smoke
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: 下载本次 macOS ARM64 构建
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.macos-arm-preview.outputs.artifact_name }}
          path: ${{ runner.temp }}/grok-consumer-artifact

      - name: 验证免费账号可以返回中文文本
        shell: bash
        env:
          AUTH_B64: ${{ secrets.GROK_CONSUMER_AUTH_B64 }}
          ARCHIVE_NAME: ${{ needs.macos-arm-preview.outputs.archive_name }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0

          auth_payload="${AUTH_B64:-}"
          unset AUTH_B64
          case "${RUNNER_TEMP}" in
            /*) ;;
            *) echo '::error::RUNNER_TEMP 不是绝对路径。'; exit 1 ;;
          esac
          if [[ "${RUNNER_TEMP}" == '/' ]]; then
            echo '::error::拒绝使用根目录作为 RUNNER_TEMP。'
            exit 1
          fi
          artifact_root="${RUNNER_TEMP}/grok-consumer-artifact"
          case "${artifact_root}" in
            "${RUNNER_TEMP}"/grok-consumer-artifact) ;;
            *) echo '::error::拒绝使用非预期的构建制品目录。'; exit 1 ;;
          esac
          smoke_root="$(mktemp -d "${RUNNER_TEMP}/grok-consumer-smoke.XXXXXX")"
          case "${smoke_root}" in
            "${RUNNER_TEMP}"/grok-consumer-smoke.*) ;;
            *) echo '::error::拒绝使用非预期的临时目录。'; exit 1 ;;
          esac
          cleanup() {
            chmod -R u+w "${smoke_root}" "${artifact_root}" 2>/dev/null || true
            rm -rf -- "${smoke_root}" "${artifact_root}"
          }
          trap cleanup EXIT HUP INT TERM

          if [[ -z "${auth_payload}" ]]; then
            echo '::error::macos-consumer-smoke 环境缺少 GROK_CONSUMER_AUTH_B64。'
            exit 1
          fi
          archive="${artifact_root}/${ARCHIVE_NAME}"
          checksum="${archive}.sha256"
          if [[ ! -f "${archive}" || ! -f "${checksum}" ]]; then
            echo '::error::macOS 构建制品不完整。'
            exit 1
          fi
          (
            cd "${artifact_root}"
            shasum -a 256 -c "$(basename "${checksum}")" >/dev/null
          )

          extract_root="${smoke_root}/package"
          auth_home="${smoke_root}/home"
          workspace="${smoke_root}/workspace"
          mkdir -p "${extract_root}" "${auth_home}" "${workspace}"
          : > "${auth_home}/config.toml"
          git init -q "${workspace}"

          auth_file="${auth_home}/auth.json"
          printf '%s' "${auth_payload}" | base64 -D > "${auth_file}"
          unset auth_payload
          chmod 0600 "${auth_file}"
          if ! jq -e 'type == "object"' "${auth_file}" >/dev/null 2>&1; then
            echo '::error::临时认证文件不是有效的 JSON 对象。'
            exit 1
          fi

          ambient_home="${HOME:-${smoke_root}/no-ambient-home}"
          config_sources=(
            '/etc/grok'
            '/Library/Application Support/ClaudeCode/managed-settings.json'
            '/Library/Managed Preferences/ai.x.grok.plist'
            "${ambient_home}/.grok/config.toml"
            "${ambient_home}/.claude.json"
            "${ambient_home}/.cursor/mcp.json"
          )
          for config_source in "${config_sources[@]}"; do
            if [[ -e "${config_source}" ]]; then
              echo '::error::runner 存在外部 Grok/MCP 配置源，拒绝加载账号执行测试。'
              exit 1
            fi
          done
          if /usr/bin/defaults read ai.x.grok requirements_toml_base64 >/dev/null 2>&1; then
            echo '::error::runner 存在 Grok MDM 配置，拒绝加载账号执行测试。'
            exit 1
          fi

          case "${ARCHIVE_NAME}" in
            grok-zh-*-macos-aarch64.tar.gz) ;;
            *) echo '::error::macOS 构建制品名称不符合约定。'; exit 1 ;;
          esac
          package_name="${ARCHIVE_NAME%.tar.gz}"
          COPYFILE_DISABLE=1 tar -xpzf "${archive}" -C "${extract_root}"
          package_root="${extract_root}/${package_name}"
          shopt -s nullglob dotglob
          top_level_entries=("${extract_root}"/*)
          shopt -u nullglob dotglob
          only_top_level="${top_level_entries[0]:-}"
          if (( ${#top_level_entries[@]} != 1 )) || \
             [[ "${only_top_level}" != "${package_root}" ]] || \
             [[ ! -d "${package_root}" || -L "${package_root}" ]]; then
            echo '::error::macOS 构建制品必须只含同名顶层目录。'
            exit 1
          fi
          if [[ "$(stat -f '%Lp' "${package_root}")" != "755" ]]; then
            echo '::error::macOS 构建制品顶层目录权限不是 0755。'
            exit 1
          fi
          grok_bin="${package_root}/grok-zh"
          if [[ ! -x "${grok_bin}" ]]; then
            echo '::error::解包后找不到可执行的 grok-zh。'
            exit 1
          fi

          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(uuidgen | tr -d '-')"
          marker="中文冒烟通过：${nonce}"
          result_file="${smoke_root}/result.json"
          stderr_file="${smoke_root}/stderr.log"
          prompt="请只回复下面这一行，不要添加解释或标点：${marker}"
          mkdir -p "${smoke_root}/tmp"
          if ! env -i \
            HOME="${auth_home}" \
            PATH='/usr/bin:/bin:/usr/sbin:/sbin' \
            TMPDIR="${smoke_root}/tmp" \
            LANG='en_US.UTF-8' \
            CI='true' \
            GROK_HOME="${auth_home}" \
            GROK_AUTH_PATH="${auth_file}" \
            GROK_DISABLE_AUTOUPDATER='1' \
            GROK_MANAGED_CONFIG='0' \
            GROK_TELEMETRY_ENABLED='0' \
            GROK_TELEMETRY_TRACE_UPLOAD='0' \
            GROK_EXTERNAL_OTEL='0' \
            GROK_CRASH_HANDLER='0' \
            DISABLE_TELEMETRY='1' \
            DISABLE_ERROR_REPORTING='1' \
            RUST_LOG='off' \
            RUST_BACKTRACE='0' \
            "${grok_bin}" \
            --single "${prompt}" \
            --output-format json \
            --no-auto-update \
            --no-wait-for-background \
            --no-subagents \
            --no-memory \
            --disable-web-search \
            --max-turns 1 \
            --tools 'todo_write' \
            --disallowed-tools 'Agent,search_tool,use_tool' \
            --cwd "${workspace}" \
            >"${result_file}" 2>"${stderr_file}"; then
            echo '::error::macOS 真账号请求执行失败；为避免泄露，不回显模型或认证输出。'
            exit 1
          fi
          if ! jq -e --arg marker "${marker}" '
              (.stopReason == "end_turn")
              and ((.text // null) | type == "string" and contains($marker))
              and ((.sessionId // null) | type == "string" and length > 0)
              and ((.requestId // null) | type == "string" and length > 0)
            ' "${result_file}" >/dev/null 2>&1; then
            echo '::error::macOS 真账号响应未通过固定字段与中文验证码校验。'
            exit 1
          fi
          echo 'macOS 免费账号真机冒烟通过：认证、联网请求、中文非空回复与会话字段均正常。'

  multiplatform-result:
    name: 六目标构建汇总
    if: ${{ always() }}
    needs:
      - rust-format-preflight
      - native-rust-validation
      - macos-intel-native-smoke
      - windows-gnu-preview
      - windows-arm64-msvc-preview
      - windows-msvc-migration-test
      - windows-msvc-migration-experiment
      - linux-x64-gnu-preview
      - linux-arm64-gnu-preview
      - macos-arm-preview
      - macos-intel-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      FORMAT_RESULT: ${{ needs.rust-format-preflight.result }}
      NATIVE_TEST_RESULT: ${{ needs.native-rust-validation.result }}
      MACOS_INTEL_NATIVE_RESULT: ${{ needs.macos-intel-native-smoke.result }}
      WINDOWS_RESULT: ${{ needs.windows-gnu-preview.result }}
      WINDOWS_ARM_RESULT: ${{ needs.windows-arm64-msvc-preview.result }}
      MIGRATION_TEST_RESULT: ${{ needs.windows-msvc-migration-test.result }}
      MIGRATION_PRODUCT_RESULT: ${{ needs.windows-msvc-migration-experiment.result }}
      LINUX_RESULT: ${{ needs.linux-x64-gnu-preview.result }}
      LINUX_ARM_RESULT: ${{ needs.linux-arm64-gnu-preview.result }}
      MACOS_RESULT: ${{ needs.macos-arm-preview.result }}
      MACOS_INTEL_RESULT: ${{ needs.macos-intel-preview.result }}
      WINDOWS_ARM_ARTIFACT: ${{ needs.windows-arm64-msvc-preview.outputs.artifact_name }}
      LINUX_ARTIFACT: ${{ needs.linux-x64-gnu-preview.outputs.artifact_name }}
      LINUX_ARM_ARTIFACT: ${{ needs.linux-arm64-gnu-preview.outputs.artifact_name }}
      MACOS_ARTIFACT: ${{ needs.macos-arm-preview.outputs.artifact_name }}
      MACOS_INTEL_ARTIFACT: ${{ needs.macos-intel-preview.outputs.artifact_name }}
    steps:
      - name: 验证六个目标均成功
        shell: bash
        run: |
          set -euo pipefail
          printf 'Windows x64: %s\nWindows ARM64: %s\nLinux x64: %s\nLinux ARM64: %s\nmacOS ARM64: %s\nmacOS Intel: %s\n' \
            "${WINDOWS_RESULT}" "${WINDOWS_ARM_RESULT}" "${LINUX_RESULT}" "${LINUX_ARM_RESULT}" "${MACOS_RESULT}" "${MACOS_INTEL_RESULT}"
          if [[ "${NATIVE_TEST_RESULT}" != success || "${WINDOWS_RESULT}" != success \
            || "${FORMAT_RESULT}" != success \
            || "${MACOS_INTEL_NATIVE_RESULT}" != success \
            || "${WINDOWS_ARM_RESULT}" != success \
            || "${MIGRATION_TEST_RESULT}" != success \
            || "${MIGRATION_PRODUCT_RESULT}" != success \
            || "${LINUX_RESULT}" != success \
            || "${LINUX_ARM_RESULT}" != success \
            || "${MACOS_RESULT}" != success \
            || "${MACOS_INTEL_RESULT}" != success ]]; then
            echo '::error::格式预检、原生测试或平台构建未成功。'
            exit 1
          fi
          if [[ -z "${WINDOWS_ARM_ARTIFACT}" || -z "${LINUX_ARTIFACT}" || -z "${LINUX_ARM_ARTIFACT}" \
            || -z "${MACOS_ARTIFACT}" || -z "${MACOS_INTEL_ARTIFACT}" ]]; then
            echo '::error::可复用工作流没有返回完整的制品名称。'
            exit 1
          fi
          {
            echo '## 六目标预览构建通过'
            echo
            echo "- Rust 全仓格式预检：${FORMAT_RESULT}"
            echo "- 五平台原生测试（与构建并行）：${NATIVE_TEST_RESULT}"
            echo "- macOS Intel 原生产物验证：${MACOS_INTEL_NATIVE_RESULT}"
            echo "- Windows x64 GNU：${WINDOWS_RESULT}"
            echo "- Windows ARM64 MSVC：${WINDOWS_ARM_RESULT}（${WINDOWS_ARM_ARTIFACT}）"
            echo "- Windows x64 MSVC 更新器原生测试：${MIGRATION_TEST_RESULT}"
            echo "- GNU 到 MSVC 实际产品迁移试验：${MIGRATION_PRODUCT_RESULT}"
            echo "- Linux x86_64 GNU：${LINUX_RESULT}（${LINUX_ARTIFACT}）"
            echo "- Linux aarch64 GNU：${LINUX_ARM_RESULT}（${LINUX_ARM_ARTIFACT}）"
            echo "- macOS ARM64：${MACOS_RESULT}（${MACOS_ARTIFACT}）"
            echo "- macOS Intel：${MACOS_INTEL_RESULT}（${MACOS_INTEL_ARTIFACT}）"
          } >> "${GITHUB_STEP_SUMMARY}"
