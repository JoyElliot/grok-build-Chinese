name: CI

on:
  push:
    branches:
      - zh-dev
      - codex/free-account-localization-macos-smoke
  pull_request:
    branches:
      - zh-dev
  workflow_dispatch:
    inputs:
      version:
        description: 可选的内嵌版本（默认为 CI 构建编号）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: zh-dev-multiplatform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-gnu-preview:
    name: Windows x64 GNU 预览版
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_CACHE_SCHEMA: v2
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RESOURCE_SAMPLE_SECONDS: "5"
      RUSTUP_TOOLCHAIN: 1.94.0-x86_64-pc-windows-gnu
      TARGET: x86_64-pc-windows-gnu

    steps:
      - name: 检出 zh-dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 选择预览版本
        id: preview
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $requested = $env:REQUESTED_VERSION
          if ([string]::IsNullOrWhiteSpace($requested)) {
            $manifest = Get-Content `
              -LiteralPath 'crates/codegen/xai-grok-pager-bin/Cargo.toml'
            $versionLine = $manifest |
              Where-Object { $_ -match '^version\s*=\s*"([^"]+)"\s*$' } |
              Select-Object -First 1
            if (!$versionLine -or $versionLine -notmatch '^version\s*=\s*"([^"]+)"\s*$') {
              throw '无法读取 pager-bin 软件包版本。'
            }
            $version = "$($matches[1])-zh.ci.$env:GITHUB_RUN_NUMBER"
          } else {
            $version = $requested.Trim()
          }
          $semverPattern = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if ($version.Length -gt 64 -or $version -notmatch $semverPattern) {
            throw "版本无效：$version"
          }
          "GROK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PACKAGE_NAME=grok-zh-$version-windows-x86_64-gnu" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "package_name=grok-zh-$version-windows-x86_64-gnu" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 配置固定版本的 Rust、MinGW 和 protoc
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          rustup toolchain install $env:RUSTUP_TOOLCHAIN `
            --profile minimal --component rustfmt --component rust-src

          $sysroot = (& rustc --print sysroot).Trim()
          $rustc = Join-Path $sysroot 'bin\rustc.exe'
          $rustdoc = Join-Path $sysroot 'bin\rustdoc.exe'
          if (!(Test-Path -LiteralPath $rustc)) {
            throw "缺少固定版本的 rustc：$rustc"
          }

          $mingw = 'C:\mingw64\bin'
          $gcc = Join-Path $mingw 'gcc.exe'
          $gxx = Join-Path $mingw 'g++.exe'
          $ar = Join-Path $mingw 'ar.exe'
          foreach ($tool in @($gcc, $gxx, $ar)) {
            if (!(Test-Path -LiteralPath $tool)) {
              throw "缺少必需的 MinGW 工具：$tool"
            }
          }

          $protocVersion = '29.3'
          $protocArchive = Join-Path $env:RUNNER_TEMP "protoc-$protocVersion-win64.zip"
          $protocRoot = Join-Path $env:RUNNER_TEMP "protoc-$protocVersion"
          $protocUri = "https://github.com/protocolbuffers/protobuf/releases/download/v$protocVersion/protoc-$protocVersion-win64.zip"
          Invoke-WebRequest -Uri $protocUri -OutFile $protocArchive
          $protocHash = (Get-FileHash -LiteralPath $protocArchive -Algorithm SHA256).Hash
          if ($protocHash -ne '57EA59E9F551AD8D71FFAA9B5CFBE0CA1F4E720972A1DB7EC2D12AB44BFF9383') {
            throw "protoc SHA-256 校验值异常：$protocHash"
          }
          Expand-Archive -LiteralPath $protocArchive -DestinationPath $protocRoot
          $protoc = Join-Path $protocRoot 'bin\protoc.exe'
          if (!(Test-Path -LiteralPath $protoc)) {
            throw "下载的 protoc 缺失：$protoc"
          }

          $targetDir = Join-Path $env:RUNNER_TEMP 'grok-zh-target'
          $cargoHome = Join-Path $env:RUNNER_TEMP 'grok-zh-cargo'

          $mingw | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "RUSTC=$rustc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTDOC=$rustdoc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_HOME=$cargoHome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_TARGET_DIR=$targetDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$gcc" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CC=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CXX=$gxx" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AR=$ar" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          & $rustc -Vv
          & $gcc --version
          & $protoc --version

      - name: 恢复 Cargo 依赖缓存
        id: cargo_home_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/grok-zh-cargo/registry
            ${{ runner.temp }}/grok-zh-cargo/git
          key: grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-zh-dev-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-zh-dev-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-
            grok-zh-cargo-home-v1-zh-dev-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-

      - name: 恢复 Cargo GNU release 缓存
        id: cargo_target_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/grok-zh-target/${{ env.TARGET }}/release
          key: grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-lto0-debug0-cgu16-shellopt1-shellcgu16-feature-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-lto0-debug0-cgu16-shellopt1-shellcgu16-feature-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-zh-dev-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-lto0-debug0-cgu16-shellopt1-shellcgu16-feature-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-zh-dev-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-lto0-debug0-cgu16-shellopt1-shellcgu16-feature-release-dist-

      # Explicit --target builds keep proc macros and build scripts outside the
      # target triple directory. Cache them separately to retain old cache hits.
      - name: 恢复 Cargo GNU 宿主构建缓存
        id: cargo_host_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/grok-zh-target/release
          key: grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-lto0-debug0-cgu16-shellopt1-shellcgu16-feature-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-lto0-debug0-cgu16-shellopt1-shellcgu16-feature-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-zh-dev-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-lto0-debug0-cgu16-shellopt1-shellcgu16-feature-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-zh-dev-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-lto0-debug0-cgu16-shellopt1-shellcgu16-feature-release-dist-

      - name: 验证 Windows 安装程序
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\packaging\windows\tests\Test-Install-GrokZh.ps1
          & powershell.exe -NoProfile -NonInteractive `
            -File .\packaging\windows\tests\Test-Install-GrokZh.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Windows PowerShell 5.1 安装程序测试失败：$LASTEXITCODE"
          }

      - name: 验证本地化元数据
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\.github\scripts\tests\Test-Write-ReleaseNotes.ps1
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt 失败：$LASTEXITCODE" }

          $metadataPath = 'crates/codegen/xai-grok-locale/locales/zh-CN-metadata.json'
          $metadata = Get-Content -LiteralPath $metadataPath -Raw | ConvertFrom-Json
          $count = @($metadata.PSObject.Properties).Count
          if ($count -lt 2000) {
            throw "zh-CN 目录条目数异常偏少：$count 个键"
          }
          if (Select-String -LiteralPath $metadataPath -SimpleMatch '词元' -Quiet) {
            throw 'zh-CN 目录必须保留 Token，而不是“词元”。'
          }
          "已验证 $count 个 zh-CN 条目。"

          cargo fetch --locked --target $env:TARGET
          if ($LASTEXITCODE -ne 0) { throw "cargo fetch 失败：$LASTEXITCODE" }
          cargo test --frozen -j $env:CARGO_BUILD_JOBS -p xai-grok-locale
          if ($LASTEXITCODE -ne 0) { throw "xai-grok-locale 测试失败：$LASTEXITCODE" }
          cargo test --frozen -j $env:CARGO_BUILD_JOBS -p xai-grok-update --features community-build --lib
          if ($LASTEXITCODE -ne 0) { throw "xai-grok-update 测试失败：$LASTEXITCODE" }
          cargo test --frozen -j $env:CARGO_BUILD_JOBS -p xai-grok-shell --lib session_summary
          if ($LASTEXITCODE -ne 0) { throw "中文会话标题测试失败：$LASTEXITCODE" }
          cargo test --frozen -j $env:CARGO_BUILD_JOBS -p xai-grok-shell --lib bundled_model_provenance_survives_acp_but_config_override_clears_it
          if ($LASTEXITCODE -ne 0) { throw "内置模型来源隔离测试失败：$LASTEXITCODE" }
          cargo test --frozen -j $env:CARGO_BUILD_JOBS -p xai-grok-shell --lib prompt_suggest_catalog_check_honors_allowlist
          if ($LASTEXITCODE -ne 0) { throw "提示词建议模型白名单测试失败：$LASTEXITCODE" }
          cargo test --frozen -j $env:CARGO_BUILD_JOBS -p xai-grok-pager --lib zh_localization_
          if ($LASTEXITCODE -ne 0) { throw "中文界面定向测试失败：$LASTEXITCODE" }
          cargo test --frozen -j $env:CARGO_BUILD_JOBS -p xai-grok-pager-minimal --lib zh_localization_
          if ($LASTEXITCODE -ne 0) { throw "精简界面中文定向测试失败：$LASTEXITCODE" }
          cargo test --frozen -j $env:CARGO_BUILD_JOBS -p xai-grok-pager --lib free_usage_upsell_shows_three_options_with_exact_labels
          if ($LASTEXITCODE -ne 0) { throw "免费账户升级选项测试失败：$LASTEXITCODE" }

      - name: 构建并监控 Windows 预览版（J${{ env.CARGO_BUILD_JOBS }}）
        id: windows_build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $monitorRoot = Join-Path $env:RUNNER_TEMP `
            "grok-resource-monitor-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Path $monitorRoot -Force | Out-Null
          $monitorScript = (Resolve-Path -LiteralPath `
            '.github\scripts\windows-build-resource-monitor.ps1').Path
          $csv = Join-Path $monitorRoot 'samples.csv'
          $stop = Join-Path $monitorRoot 'stop.signal'
          $ready = Join-Path $monitorRoot 'ready.signal'
          $metaPath = Join-Path $monitorRoot 'meta.json'
          $stdout = Join-Path $monitorRoot 'monitor.stdout.log'
          $stderr = Join-Path $monitorRoot 'monitor.stderr.log'
          $summary = Join-Path $monitorRoot 'summary.json'

          $pwsh = Join-Path $PSHOME 'pwsh.exe'
          $arguments = @(
            '-NoLogo', '-NoProfile', '-NonInteractive',
            '-ExecutionPolicy', 'Bypass', '-File', ('"{0}"' -f $monitorScript),
            '-Mode', 'Monitor',
            '-CsvPath', ('"{0}"' -f $csv),
            '-StopPath', ('"{0}"' -f $stop),
            '-ReadyPath', ('"{0}"' -f $ready),
            '-TargetPath', ('"{0}"' -f $env:CARGO_TARGET_DIR),
            '-IntervalSeconds', $env:RESOURCE_SAMPLE_SECONDS,
            '-MaxRuntimeSeconds', '10800'
          )
          $monitor = Start-Process -FilePath $pwsh -ArgumentList $arguments `
            -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden `
            -RedirectStandardOutput $stdout -RedirectStandardError $stderr `
            -PassThru
          [ordered]@{
            Root = $monitorRoot
            MonitorScript = $monitorScript
            CsvPath = $csv
            StopPath = $stop
            ReadyPath = $ready
            StdoutPath = $stdout
            StderrPath = $stderr
            SummaryPath = $summary
            Pid = [int]$monitor.Id
            StartedAtUtc = [DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json | Set-Content -LiteralPath $metaPath -Encoding utf8
          @(
            "RESOURCE_MONITOR_ROOT=$monitorRoot"
            "RESOURCE_MONITOR_CSV=$csv"
            "RESOURCE_MONITOR_SUMMARY=$summary"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $buildStartedAt = $null
          $cargoExitCode = $null
          $caughtError = $null
          try {
            $readyDeadline = [DateTime]::UtcNow.AddSeconds(30)
            while (!(Test-Path -LiteralPath $ready) -and
              [DateTime]::UtcNow -lt $readyDeadline -and !$monitor.HasExited) {
              Start-Sleep -Milliseconds 250
              $monitor.Refresh()
            }
            if (!(Test-Path -LiteralPath $ready)) {
              $monitorError = if (Test-Path -LiteralPath $stderr) {
                Get-Content -LiteralPath $stderr -Raw
              } else {
                '无 stderr。'
              }
              throw "资源监控未能采集首个样本：$monitorError"
            }

            $buildStartedAt = Get-Date
            "使用 $env:CARGO_BUILD_JOBS 路 Cargo 并行任务。"
            cargo build --frozen -j $env:CARGO_BUILD_JOBS `
              --target $env:TARGET `
              -p xai-grok-pager-bin `
              --profile release `
              --features release-dist `
              --timings `
              --config profile.release.lto=false `
              --config profile.release.debug=0 `
              --config profile.release.codegen-units=16 `
              --config profile.release.package.xai-grok-shell.opt-level=1 `
              --config profile.release.package.xai-grok-shell.codegen-units=16
            $cargoExitCode = if ($null -eq $LASTEXITCODE) {
              0
            } else {
              [int]$LASTEXITCODE
            }
          } catch {
            $caughtError = $_
            if ($null -eq $cargoExitCode -and $null -ne $LASTEXITCODE) {
              $cargoExitCode = [int]$LASTEXITCODE
            }
          } finally {
            $buildDurationSeconds = if ($null -eq $buildStartedAt) {
              0
            } else {
              [int][Math]::Ceiling(((Get-Date) - $buildStartedAt).TotalSeconds)
            }
            "BUILD_DURATION_SECONDS=$buildDurationSeconds" |
              Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

            try {
              New-Item -ItemType File -Path $stop -Force | Out-Null
            } catch {
              Write-Warning "无法通知资源监控停止：$($_.Exception.Message)"
            }

            $stopDeadline = [DateTime]::UtcNow.AddSeconds(20)
            $liveMonitor = Get-Process -Id $monitor.Id -ErrorAction SilentlyContinue
            while ($liveMonitor -and !$liveMonitor.HasExited -and
              [DateTime]::UtcNow -lt $stopDeadline) {
              Start-Sleep -Milliseconds 250
              $liveMonitor = Get-Process -Id $monitor.Id -ErrorAction SilentlyContinue
            }
            if ($liveMonitor -and !$liveMonitor.HasExited) {
              $win32Process = Get-CimInstance Win32_Process `
                -Filter "ProcessId=$($monitor.Id)" -ErrorAction SilentlyContinue |
                Select-Object -First 1
              $sameMonitor = $win32Process -and
                $win32Process.Name -ieq 'pwsh.exe' -and
                $win32Process.CommandLine -and
                $win32Process.CommandLine.IndexOf(
                  $monitorScript, [StringComparison]::OrdinalIgnoreCase
                ) -ge 0
              if ($sameMonitor) {
                Stop-Process -Id $monitor.Id -Force -ErrorAction SilentlyContinue
                Write-Warning '资源监控未及时退出，已验证身份后停止。'
              } else {
                Write-Warning "PID $($monitor.Id) 身份无法确认，未强制停止。"
              }
            }
          }

          if ($null -ne $cargoExitCode -and $cargoExitCode -ne 0) {
            throw "Cargo 构建失败：$cargoExitCode"
          }
          if ($null -ne $caughtError) {
            throw $caughtError
          }

      - name: 汇总并验证构建资源监控
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          BUILD_OUTCOME: ${{ steps.windows_build.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:RESOURCE_MONITOR_CSV)) {
            Write-Warning '构建步骤未生成资源监控路径。'
            exit 0
          }
          $duration = 0
          if (![int]::TryParse($env:BUILD_DURATION_SECONDS, [ref]$duration)) {
            $duration = 0
          }
          & .\.github\scripts\windows-build-resource-monitor.ps1 `
            -Mode Summarize `
            -CsvPath $env:RESOURCE_MONITOR_CSV `
            -SummaryPath $env:RESOURCE_MONITOR_SUMMARY `
            -StepSummaryPath $env:GITHUB_STEP_SUMMARY `
            -BuildOutcome $env:BUILD_OUTCOME `
            -BuildDurationSeconds $duration `
            -IntervalSeconds ([int]$env:RESOURCE_SAMPLE_SECONDS)

      - name: 上传构建资源监控与 Cargo timings
        id: monitor_artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grok-zh-build-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/grok-resource-monitor-${{ github.run_id }}-${{ github.run_attempt }}
            ${{ runner.temp }}/grok-zh-target/cargo-timings
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

      - name: 打包未签名绿色预览版
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $package = Join-Path $dist $env:PACKAGE_NAME
          New-Item -ItemType Directory -Path $package -Force | Out-Null

          $builtExe = Join-Path $env:CARGO_TARGET_DIR "$env:TARGET\release\grok-zh.exe"
          if (!(Test-Path -LiteralPath $builtExe)) {
            throw "缺少构建出的可执行文件：$builtExe"
          }
          $packageExe = Join-Path $package 'grok-zh.exe'
          Copy-Item -LiteralPath $builtExe -Destination $packageExe

          $strip = 'C:\mingw64\bin\strip.exe'
          $objdump = 'C:\mingw64\bin\objdump.exe'
          & $strip --strip-debug $packageExe
          if ($LASTEXITCODE -ne 0) {
            throw "strip 失败：$LASTEXITCODE"
          }

          Copy-Item -LiteralPath 'packaging\windows\agent-zh.cmd' `
            -Destination (Join-Path $package 'agent-zh.cmd')
          Copy-Item -LiteralPath 'packaging\windows\一键安装.cmd' `
            -Destination (Join-Path $package '一键安装.cmd')
          Copy-Item -LiteralPath 'packaging\windows\[可选]替换原始启动方式.cmd' `
            -Destination (Join-Path $package '[可选]替换原始启动方式.cmd')
          Copy-Item -LiteralPath 'packaging\windows\Install-GrokZh.ps1' `
            -Destination (Join-Path $package 'Install-GrokZh.ps1')
          Copy-Item -LiteralPath 'packaging\windows\INSTALL-WINDOWS.md' `
            -Destination (Join-Path $package 'INSTALL-WINDOWS.md')

          $rgVersion = '15.1.0'
          $rgArchive = Join-Path $env:RUNNER_TEMP 'ripgrep.zip'
          $rgExtract = Join-Path $env:RUNNER_TEMP 'ripgrep'
          $rgUri = "https://github.com/BurntSushi/ripgrep/releases/download/$rgVersion/ripgrep-$rgVersion-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $rgUri -OutFile $rgArchive
          Expand-Archive -LiteralPath $rgArchive -DestinationPath $rgExtract
          $rgSource = Get-ChildItem -LiteralPath $rgExtract -Filter rg.exe -Recurse -File |
            Select-Object -First 1
          if (!$rgSource) {
            throw '下载的 ripgrep 压缩包不包含 rg.exe。'
          }
          $rgHash = (Get-FileHash -LiteralPath $rgSource.FullName -Algorithm SHA256).Hash
          if ($rgHash -ne 'DECDD4992F3F1B9A5EF9898F1B40AB16886D579D6516B4EFD3D5EAA19364E408') {
            throw "ripgrep SHA-256 校验值异常：$rgHash"
          }
          Copy-Item -LiteralPath $rgSource.FullName -Destination (Join-Path $package 'rg.exe')

          Copy-Item -LiteralPath 'LICENSE' -Destination (Join-Path $package 'LICENSE-grok-build.txt')
          $licenseRoot = Join-Path $package 'licenses'
          $rgLicenseDir = Join-Path $licenseRoot 'ripgrep'
          $projectNoticeDir = Join-Path $licenseRoot 'project'
          New-Item -ItemType Directory -Path $rgLicenseDir,$projectNoticeDir -Force | Out-Null
          foreach ($licenseName in @('COPYING', 'LICENSE-MIT', 'UNLICENSE')) {
            $license = Get-ChildItem -LiteralPath $rgExtract -Filter $licenseName -Recurse -File |
              Select-Object -First 1
            if (!$license) {
              throw "下载的 ripgrep 压缩包缺少许可证文件：$licenseName"
            }
            Copy-Item -LiteralPath $license.FullName -Destination $rgLicenseDir
          }
          Copy-Item -LiteralPath 'THIRD-PARTY-NOTICES' -Destination $projectNoticeDir
          Copy-Item -LiteralPath 'crates\codegen\xai-grok-tools\THIRD_PARTY_NOTICES.md' `
            -Destination $projectNoticeDir
          Copy-Item -LiteralPath 'third_party\NOTICE' -Destination $projectNoticeDir

          $signature = (Get-AuthenticodeSignature -LiteralPath $packageExe).Status
          $pe = (& $objdump -f $packageExe | Select-String 'file format').Line.Trim()
          @"
          Grok Build 简体中文 CI 预览版
          Version: $env:GROK_VERSION
          Commit: $env:GITHUB_SHA
          Target: $env:TARGET
          Profile: $($env:CARGO_BUILD_JOBS)-way parallel release with release-dist features (LTO disabled, debug disabled, codegen-units=16; not canonical Thin-LTO release-dist)
          PE: $pe
          Authenticode: $signature
          Executable started by CI: false
          Default commands after installation: grok-zh, agent-zh
          Optional command takeover: grok, agent
          "@.Trim() | Set-Content -LiteralPath (Join-Path $package 'BUILD-INFO.txt') -Encoding utf8

          $manifestNames = @(
            'grok-zh.exe',
            'agent-zh.cmd',
            'rg.exe',
            '一键安装.cmd',
            '[可选]替换原始启动方式.cmd',
            'Install-GrokZh.ps1',
            'INSTALL-WINDOWS.md',
            'LICENSE-grok-build.txt',
            'BUILD-INFO.txt',
            'licenses/ripgrep/COPYING',
            'licenses/ripgrep/LICENSE-MIT',
            'licenses/ripgrep/UNLICENSE',
            'licenses/project/THIRD-PARTY-NOTICES',
            'licenses/project/THIRD_PARTY_NOTICES.md',
            'licenses/project/NOTICE'
          )
          $manifestLines = foreach ($name in $manifestNames) {
            $path = Join-Path $package $name
            $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash
            "$hash  $name"
          }
          $manifestLines | Set-Content `
            -LiteralPath (Join-Path $package 'SHA256SUMS.txt') -Encoding utf8

          $topLevelEntries = @(Get-ChildItem -LiteralPath $dist -Force)
          if ($topLevelEntries.Count -ne 1 -or !$topLevelEntries[0].PSIsContainer) {
            throw 'dist 必须只包含一个解压后的软件包目录。'
          }
          if (Get-ChildItem -LiteralPath $dist -Filter '*.zip' -Recurse -File) {
            throw '预览制品不得包含嵌套 ZIP 压缩包。'
          }
          "已准备解压后的软件包目录：$package"

      - name: 上传绿色预览版
        id: preview_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grok-zh-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/${{ steps.preview.outputs.package_name }}
          if-no-files-found: error
          compression-level: 6
          retention-days: 7

      - name: 在摘要中发布制品详情
        shell: pwsh
        run: |
          $artifactUrl = '${{ steps.preview_artifact.outputs.artifact-url }}'
          $artifactDigest = '${{ steps.preview_artifact.outputs.artifact-digest }}'
          $monitorArtifactUrl = '${{ steps.monitor_artifact.outputs.artifact-url }}'
          $cargoHomeCacheHit = '${{ steps.cargo_home_cache.outputs.cache-hit }}'
          $cargoTargetCacheHit = '${{ steps.cargo_target_cache.outputs.cache-hit }}'
          $cargoHomeMatchedKey = '${{ steps.cargo_home_cache.outputs.cache-matched-key }}'
          $cargoTargetMatchedKey = '${{ steps.cargo_target_cache.outputs.cache-matched-key }}'
          if ($cargoHomeCacheHit -eq 'true') {
            $cargoHomeCacheStatus = '精确命中'
          } elseif ($cargoHomeCacheHit -eq 'false') {
            $cargoHomeCacheStatus = '部分恢复'
          } else {
            $cargoHomeCacheStatus = '未命中（首次或缓存已失效）'
          }
          if ($cargoTargetCacheHit -eq 'true') {
            $cargoTargetCacheStatus = '精确命中'
          } elseif ($cargoTargetCacheHit -eq 'false') {
            $cargoTargetCacheStatus = '部分恢复'
          } else {
            $cargoTargetCacheStatus = '未命中（首次或缓存已失效）'
          }
          @"
          ## Windows GNU 预览版

          - 版本：``$env:GROK_VERSION``
          - 制品：[$env:PACKAGE_NAME]($artifactUrl)
          - 制品 SHA-256：``$artifactDigest``
          - Cargo 并行任务数：``$env:CARGO_BUILD_JOBS``
          - Cargo 依赖缓存：$cargoHomeCacheStatus
          - Cargo 依赖缓存匹配键：``$cargoHomeMatchedKey``
          - Cargo GNU release 缓存：$cargoTargetCacheStatus
          - Cargo GNU release 缓存匹配键：``$cargoTargetMatchedKey``
          - Cargo 构建耗时：``$env:BUILD_DURATION_SECONDS`` 秒
          - 构建资源监控与 Cargo timings：[$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT]($monitorArtifactUrl)
          - 仅一层压缩：下载的制品解压一次即可安装或运行。
          - 软件包文件哈希：``SHA256SUMS.txt``
          - 未签名的 $($env:CARGO_BUILD_JOBS) 路并行 CI 预览版；可执行文件未启动。
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 保存 Cargo GNU release 缓存
        if: ${{ success() && github.ref_name == 'zh-dev' && steps.cargo_target_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/grok-zh-target/${{ env.TARGET }}/release
          key: ${{ steps.cargo_target_cache.outputs.cache-primary-key }}

      - name: 保存 Cargo GNU 宿主构建缓存
        if: ${{ success() && github.ref == 'refs/heads/zh-dev' && steps.cargo_host_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/grok-zh-target/release
          key: ${{ steps.cargo_host_cache.outputs.cache-primary-key }}

      - name: 保存 Cargo 依赖缓存
        if: ${{ success() && github.ref_name == 'zh-dev' && steps.cargo_home_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ runner.temp }}/grok-zh-cargo/registry
            ${{ runner.temp }}/grok-zh-cargo/git
          key: ${{ steps.cargo_home_cache.outputs.cache-primary-key }}

  linux-x64-gnu-preview:
    name: Linux x64 GNU 预览版
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      package_name: ${{ steps.build.outputs.package_name }}
      archive_name: ${{ steps.build.outputs.archive_name }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_CACHE_SCHEMA: linux-x64-v1
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      DOTSLASH_VERSION: "0.5.9"
      DOTSLASH_SHA256: 7400dd0dbdf05d3be4e604b62807eb1bcbaa0d1bced010d30746243759e0ac03
      RUSTUP_TOOLCHAIN: 1.94.0-x86_64-unknown-linux-gnu
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 构建并验证 Linux x64 GNU
        id: build
        uses: ./.github/actions/build-linux-x64
        with:
          version: ${{ inputs.version }}
          release_build: 'false'

  macos-arm-preview:
    name: macOS ARM64 预览版
    runs-on: macos-15
    timeout-minutes: 240
    outputs:
      package_name: ${{ steps.build.outputs.package_name }}
      archive_name: ${{ steps.build.outputs.archive_name }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_CACHE_SCHEMA: macos-arm-v1
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RUSTUP_TOOLCHAIN: 1.94.0-aarch64-apple-darwin
      TARGET: aarch64-apple-darwin
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 构建并验证 macOS ARM64
        id: build
        uses: ./.github/actions/build-macos-arm
        with:
          version: ${{ inputs.version }}
          release_build: 'false'

  macos-consumer-smoke:
    name: macOS 免费账号真机冒烟
    if: >-
      ${{ github.event_name == 'push'
          && github.repository == 'JoyElliot/grok-build-Chinese'
          && github.ref == 'refs/heads/codex/free-account-localization-macos-smoke' }}
    needs:
      - macos-arm-preview
    environment: macos-consumer-smoke
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: 下载本次 macOS ARM64 构建
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.macos-arm-preview.outputs.artifact_name }}
          path: ${{ runner.temp }}/grok-consumer-artifact

      - name: 验证免费账号可以返回中文文本
        shell: bash
        env:
          AUTH_B64: ${{ secrets.GROK_CONSUMER_AUTH_B64 }}
          ARCHIVE_NAME: ${{ needs.macos-arm-preview.outputs.archive_name }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0

          auth_payload="${AUTH_B64:-}"
          unset AUTH_B64
          case "${RUNNER_TEMP}" in
            /*) ;;
            *) echo '::error::RUNNER_TEMP 不是绝对路径。'; exit 1 ;;
          esac
          if [[ "${RUNNER_TEMP}" == '/' ]]; then
            echo '::error::拒绝使用根目录作为 RUNNER_TEMP。'
            exit 1
          fi
          artifact_root="${RUNNER_TEMP}/grok-consumer-artifact"
          case "${artifact_root}" in
            "${RUNNER_TEMP}"/grok-consumer-artifact) ;;
            *) echo '::error::拒绝使用非预期的构建制品目录。'; exit 1 ;;
          esac
          smoke_root="$(mktemp -d "${RUNNER_TEMP}/grok-consumer-smoke.XXXXXX")"
          case "${smoke_root}" in
            "${RUNNER_TEMP}"/grok-consumer-smoke.*) ;;
            *) echo '::error::拒绝使用非预期的临时目录。'; exit 1 ;;
          esac
          cleanup() {
            chmod -R u+w "${smoke_root}" "${artifact_root}" 2>/dev/null || true
            rm -rf -- "${smoke_root}" "${artifact_root}"
          }
          trap cleanup EXIT HUP INT TERM

          if [[ -z "${auth_payload}" ]]; then
            echo '::error::macos-consumer-smoke 环境缺少 GROK_CONSUMER_AUTH_B64。'
            exit 1
          fi
          archive="${artifact_root}/${ARCHIVE_NAME}"
          checksum="${archive}.sha256"
          if [[ ! -f "${archive}" || ! -f "${checksum}" ]]; then
            echo '::error::macOS 构建制品不完整。'
            exit 1
          fi
          (
            cd "${artifact_root}"
            shasum -a 256 -c "$(basename "${checksum}")" >/dev/null
          )

          extract_root="${smoke_root}/package"
          auth_home="${smoke_root}/home"
          workspace="${smoke_root}/workspace"
          mkdir -p "${extract_root}" "${auth_home}" "${workspace}"
          : > "${auth_home}/config.toml"
          git init -q "${workspace}"

          auth_file="${auth_home}/auth.json"
          printf '%s' "${auth_payload}" | base64 -D > "${auth_file}"
          unset auth_payload
          chmod 0600 "${auth_file}"
          if ! jq -e 'type == "object"' "${auth_file}" >/dev/null 2>&1; then
            echo '::error::临时认证文件不是有效的 JSON 对象。'
            exit 1
          fi

          ambient_home="${HOME:-${smoke_root}/no-ambient-home}"
          config_sources=(
            '/etc/grok'
            '/Library/Application Support/ClaudeCode/managed-settings.json'
            '/Library/Managed Preferences/ai.x.grok.plist'
            "${ambient_home}/.grok/config.toml"
            "${ambient_home}/.claude.json"
            "${ambient_home}/.cursor/mcp.json"
          )
          for config_source in "${config_sources[@]}"; do
            if [[ -e "${config_source}" ]]; then
              echo '::error::runner 存在外部 Grok/MCP 配置源，拒绝加载账号执行测试。'
              exit 1
            fi
          done
          if /usr/bin/defaults read ai.x.grok requirements_toml_base64 >/dev/null 2>&1; then
            echo '::error::runner 存在 Grok MDM 配置，拒绝加载账号执行测试。'
            exit 1
          fi

          case "${ARCHIVE_NAME}" in
            grok-zh-*-macos-aarch64.tar.gz) ;;
            *) echo '::error::macOS 构建制品名称不符合约定。'; exit 1 ;;
          esac
          package_name="${ARCHIVE_NAME%.tar.gz}"
          COPYFILE_DISABLE=1 tar -xpzf "${archive}" -C "${extract_root}"
          package_root="${extract_root}/${package_name}"
          shopt -s nullglob dotglob
          top_level_entries=("${extract_root}"/*)
          shopt -u nullglob dotglob
          only_top_level="${top_level_entries[0]:-}"
          if (( ${#top_level_entries[@]} != 1 )) || \
             [[ "${only_top_level}" != "${package_root}" ]] || \
             [[ ! -d "${package_root}" || -L "${package_root}" ]]; then
            echo '::error::macOS 构建制品必须只含同名顶层目录。'
            exit 1
          fi
          if [[ "$(stat -f '%Lp' "${package_root}")" != "755" ]]; then
            echo '::error::macOS 构建制品顶层目录权限不是 0755。'
            exit 1
          fi
          grok_bin="${package_root}/grok-zh"
          if [[ ! -x "${grok_bin}" ]]; then
            echo '::error::解包后找不到可执行的 grok-zh。'
            exit 1
          fi

          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(uuidgen | tr -d '-')"
          marker="中文冒烟通过：${nonce}"
          result_file="${smoke_root}/result.json"
          stderr_file="${smoke_root}/stderr.log"
          prompt="请只回复下面这一行，不要添加解释或标点：${marker}"
          mkdir -p "${smoke_root}/tmp"
          if ! env -i \
            HOME="${auth_home}" \
            PATH='/usr/bin:/bin:/usr/sbin:/sbin' \
            TMPDIR="${smoke_root}/tmp" \
            LANG='en_US.UTF-8' \
            CI='true' \
            GROK_HOME="${auth_home}" \
            GROK_AUTH_PATH="${auth_file}" \
            GROK_DISABLE_AUTOUPDATER='1' \
            GROK_MANAGED_CONFIG='0' \
            GROK_TELEMETRY_ENABLED='0' \
            GROK_TELEMETRY_TRACE_UPLOAD='0' \
            GROK_EXTERNAL_OTEL='0' \
            GROK_CRASH_HANDLER='0' \
            DISABLE_TELEMETRY='1' \
            DISABLE_ERROR_REPORTING='1' \
            RUST_LOG='off' \
            RUST_BACKTRACE='0' \
            "${grok_bin}" \
            --single "${prompt}" \
            --output-format json \
            --no-auto-update \
            --no-wait-for-background \
            --no-subagents \
            --no-memory \
            --disable-web-search \
            --max-turns 1 \
            --tools 'todo_write' \
            --disallowed-tools 'Agent,search_tool,use_tool' \
            --cwd "${workspace}" \
            >"${result_file}" 2>"${stderr_file}"; then
            echo '::error::macOS 真账号请求执行失败；为避免泄露，不回显模型或认证输出。'
            exit 1
          fi
          if ! jq -e --arg marker "${marker}" '
              (.stopReason == "end_turn")
              and ((.text // null) | type == "string" and contains($marker))
              and ((.sessionId // null) | type == "string" and length > 0)
              and ((.requestId // null) | type == "string" and length > 0)
            ' "${result_file}" >/dev/null 2>&1; then
            echo '::error::macOS 真账号响应未通过固定字段与中文验证码校验。'
            exit 1
          fi
          echo 'macOS 免费账号真机冒烟通过：认证、联网请求、中文非空回复与会话字段均正常。'

  multiplatform-result:
    name: 三端构建汇总
    if: ${{ always() }}
    needs:
      - windows-gnu-preview
      - linux-x64-gnu-preview
      - macos-arm-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WINDOWS_RESULT: ${{ needs.windows-gnu-preview.result }}
      LINUX_RESULT: ${{ needs.linux-x64-gnu-preview.result }}
      MACOS_RESULT: ${{ needs.macos-arm-preview.result }}
      LINUX_ARTIFACT: ${{ needs.linux-x64-gnu-preview.outputs.artifact_name }}
      MACOS_ARTIFACT: ${{ needs.macos-arm-preview.outputs.artifact_name }}
    steps:
      - name: 验证三个目标均成功
        shell: bash
        run: |
          set -euo pipefail
          printf 'Windows: %s\nLinux: %s\nmacOS: %s\n' \
            "${WINDOWS_RESULT}" "${LINUX_RESULT}" "${MACOS_RESULT}"
          if [[ "${WINDOWS_RESULT}" != success \
            || "${LINUX_RESULT}" != success \
            || "${MACOS_RESULT}" != success ]]; then
            echo '::error::至少一个平台构建未成功。'
            exit 1
          fi
          if [[ -z "${LINUX_ARTIFACT}" || -z "${MACOS_ARTIFACT}" ]]; then
            echo '::error::可复用工作流没有返回完整的制品名称。'
            exit 1
          fi
          {
            echo '## 三端预览构建通过'
            echo
            echo "- Windows x64 GNU：${WINDOWS_RESULT}"
            echo "- Linux x86_64 GNU：${LINUX_RESULT}（${LINUX_ARTIFACT}）"
            echo "- macOS ARM64：${MACOS_RESULT}（${MACOS_ARTIFACT}）"
          } >> "${GITHUB_STEP_SUMMARY}"
