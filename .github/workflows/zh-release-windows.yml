name: Release

on:
  push:
    tags:
      - "v*"
      - "release-v*"

permissions:
  contents: read

concurrency:
  group: zh-release-publisher
  cancel-in-progress: false

jobs:
  release-plan:
    name: 验证发布计划
    runs-on: windows-2022
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.release_meta.outputs.release_tag }}
      grok_version: ${{ steps.release_meta.outputs.grok_version }}
      source_commit: ${{ steps.release_meta.outputs.source_commit }}
      package_name: ${{ steps.release_meta.outputs.package_name }}
      zip_name: ${{ steps.release_meta.outputs.zip_name }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      legacy_release: ${{ steps.release_meta.outputs.legacy_release }}
      include_macos: ${{ steps.release_meta.outputs.include_macos }}
      include_linux: ${{ steps.release_meta.outputs.include_linux }}
      windows_artifact_name: ${{ steps.release_meta.outputs.windows_artifact_name }}
      notes_artifact_name: ${{ steps.release_meta.outputs.notes_artifact_name }}
      publish_legacy_sha256: ${{ steps.release_meta.outputs.publish_legacy_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 检出发布标签
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: 验证标签、版本与发布冲突
        id: release_meta
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME.Trim()
          $legacyPattern = '^v(?<version>(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)(?:-(?<prerelease>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?)$'
          $modernPattern = '^release-v(?<version>(?<major>0|[1-9][0-9]*)\.(?<minor>0|[1-9][0-9]*)\.(?<patch>0|[1-9][0-9]*)(?:-(?<prerelease>[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?)$'
          if ($tag -cmatch $legacyPattern) {
            $legacyRelease = $true
          } elseif ($tag -cmatch $modernPattern) {
            $legacyRelease = $false
          } else {
            throw "Release Tag 必须是 v1.0.8 及之前的桥接格式，或 release-vA.B.C 三段后续格式，且不得含 build metadata：$tag"
          }
          $version = $matches.version
          if ($version.Length -gt 64) {
            throw "Release 版本长度不得超过 64 个字符：$version"
          }
          [uint64]$major = $matches['major']
          [uint64]$minor = $matches['minor']
          [uint64]$patch = $matches['patch']
          $tagBaseVersion = ($version -split '-', 2)[0]
          foreach ($number in @($matches['major'], $matches['minor'], $matches['patch'])) {
            [uint64]$parsedNumber = 0
            if ($number -and ![uint64]::TryParse([string]$number, [ref]$parsedNumber)) {
              throw "Release Tag 数值超出 u64 范围：$tag"
            }
          }
          if ($version.Contains('-')) {
            $prerelease = ($version -split '-', 2)[1]
            foreach ($identifier in ($prerelease -split '\.')) {
              if ($identifier -cmatch '^[0-9]+$') {
                [uint64]$parsedIdentifier = 0
                if (($identifier.Length -gt 1 -and $identifier.StartsWith('0')) -or
                    ![uint64]::TryParse($identifier, [ref]$parsedIdentifier)) {
                  throw "SemVer 数字预发布标识必须无前导零且不超过 u64：$identifier"
                }
              }
            }
          }
          $isAfterBridgeBase = $major -gt 1 -or
            ($major -eq 1 -and $minor -gt 0) -or
            ($major -eq 1 -and $minor -eq 0 -and $patch -gt 8)
          if ($legacyRelease -and ($version.Contains('-') -or $isAfterBridgeBase)) {
            throw "v* 命名空间只允许截至 v1.0.8 的稳定桥接版本；后续版本必须使用 release-v*：$tag"
          }
          if (!$legacyRelease -and !$version.Contains('-') -and !$isAfterBridgeBase) {
            throw "截至 v1.0.8 的稳定版本必须使用旧 v* 命名空间：$tag"
          }
          function Read-PackageVersion([string]$path) {
            $line = Get-Content -LiteralPath $path |
              Where-Object { $_ -match '^version\s*=\s*"([^"]+)"\s*$' } |
              Select-Object -First 1
            if (!$line -or $line -notmatch '^version\s*=\s*"([^"]+)"\s*$') {
              throw "无法从 $path 读取版本。"
            }
            return $matches[1]
          }

          $pagerVersion = Read-PackageVersion 'crates/codegen/xai-grok-pager-bin/Cargo.toml'
          $pagerCoreVersion = Read-PackageVersion 'crates/codegen/xai-grok-pager/Cargo.toml'
          $shellVersion = Read-PackageVersion 'crates/codegen/xai-grok-shell/Cargo.toml'
          $coreVersion = Read-PackageVersion 'crates/codegen/xai-grok-version/Cargo.toml'
          if ($pagerVersion -cne $coreVersion -or $pagerCoreVersion -cne $coreVersion -or
              $shellVersion -cne $coreVersion -or $tagBaseVersion -cne $coreVersion) {
            throw "Tag 基线与四个发布包版本必须一致：tag=$tagBaseVersion pager-bin=$pagerVersion pager=$pagerCoreVersion shell=$shellVersion core=$coreVersion"
          }

          $tagCommit = (& git rev-list -n 1 $tag).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:GITHUB_SHA) {
            throw "Tag 必须直接构建其所指提交：tag=$tagCommit workflow=$env:GITHUB_SHA"
          }

          $releasePages = @(
            gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" |
              ConvertFrom-Json
          )
          if ($LASTEXITCODE -ne 0) {
            throw "无法读取现有 Release 列表：$LASTEXITCODE"
          }
          $allReleases = @(
            foreach ($page in $releasePages) {
              foreach ($candidate in @($page)) { $candidate }
            }
          )
          if (@($allReleases | Where-Object { $_.tag_name -ceq $tag }).Count -ne 0) {
            throw "Release $tag 已存在；不可变发布不得覆盖。"
          }
          $policy = Get-Content -LiteralPath '.github/release-policy.json' -Raw | ConvertFrom-Json
          $publishLegacySha256 = & ./.github/scripts/validate-release-policy.ps1 -Policy $policy -Releases $allReleases -CurrentTag $tag
          if (!$publishLegacySha256) {
            $bridge = @($allReleases | Where-Object { $_.tag_name -ceq $policy.legacy_bridge_tag })[0]
            & ./.github/scripts/verify-protocol-bridge.ps1 -Release $bridge
          }
          $packageName = "grok-zh-$version-windows-x86_64-gnu"
          $zipName = "$packageName.zip"
          $isPrerelease = $version.Contains('-').ToString().ToLowerInvariant()
          # Plain v1.0.8 is the final two-asset Windows bridge consumable by the
          # published v1.0.5 updater. All release-v* tags use the complete
          # cross-platform contract and are intentionally invisible to v1.0.5.
          $includeMacos = !$legacyRelease
          $includeLinux = !$legacyRelease
          $windowsArtifactName = "grok-zh-windows-release-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $notesArtifactName = "grok-zh-release-notes-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "RELEASE_TAG=$tag" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GROK_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "PACKAGE_NAME=$packageName" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_NAME=$zipName" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "IS_PRERELEASE=$isPrerelease" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "LEGACY_RELEASE=$($legacyRelease.ToString().ToLowerInvariant())" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8
          @{
            release_tag = $tag
            grok_version = $version
            source_commit = $env:GITHUB_SHA
            package_name = $packageName
            zip_name = $zipName
            is_prerelease = $isPrerelease
            legacy_release = $legacyRelease.ToString().ToLowerInvariant()
            include_macos = $includeMacos.ToString().ToLowerInvariant()
            include_linux = $includeLinux.ToString().ToLowerInvariant()
            windows_artifact_name = $windowsArtifactName
            notes_artifact_name = $notesArtifactName
            publish_legacy_sha256 = $publishLegacySha256.ToString().ToLowerInvariant()
          }.GetEnumerator() | ForEach-Object {
            "$($_.Key)=$($_.Value)" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: 预生成并验证中文更新日志
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          & .\.github\scripts\write-release-notes.ps1 `
            -CurrentTag $env:RELEASE_TAG `
            -OutputPath $notes `
            -Repository $env:GITHUB_REPOSITORY `
            -GitHubToken $env:GH_TOKEN
          if (!(Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw '未生成 Release 更新日志。'
          }
          "RELEASE_NOTES_PATH=$notes" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "## $env:GROK_VERSION 更新日志" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content -LiteralPath $notes | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 上传 Release 更新日志
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release_meta.outputs.notes_artifact_name }}
          path: ${{ env.RELEASE_NOTES_PATH }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  windows-x64-gnu-rust-validation:
    name: Windows GNU 测试 (${{ matrix.suite }})
    needs: release-plan
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        suite: [core, ui]
    env:
      RELEASE_TAG: ${{ needs.release-plan.outputs.release_tag }}
      GROK_VERSION: ${{ needs.release-plan.outputs.grok_version }}
      PACKAGE_NAME: ${{ needs.release-plan.outputs.package_name }}
      ZIP_NAME: ${{ needs.release-plan.outputs.zip_name }}
      LEGACY_RELEASE: ${{ needs.release-plan.outputs.legacy_release }}
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_CACHE_SCHEMA: v2
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RUSTUP_TOOLCHAIN: 1.94.0-x86_64-pc-windows-gnu
      TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-plan.outputs.source_commit }}
      - name: 验证安装器、协议及工作流门禁
        if: matrix.suite == 'core'
        timeout-minutes: 15
        shell: pwsh
        run: ./.github/scripts/check-windows-package.ps1 -Mode release
      - name: 准备 Windows GNU 测试环境
        uses: ./.github/actions/setup-windows-gnu
        with:
          version: ${{ needs.release-plan.outputs.grok_version }}
      - name: 运行独立测试分片
        uses: ./.github/actions/validate-windows-gnu
        with:
          suite: ${{ matrix.suite }}
          mode: release
          save-cache: 'false'

  windows-x64-gnu-validation:
    name: Windows x64 GNU 发布验证
    if: always()
    needs:
      - release-plan
      - windows-x64-gnu-rust-validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检查所有验证分片
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          jq -e 'length > 0 and all(. == "success")' <<< "$RESULTS"

  windows-x64-gnu:
    name: Windows x64 GNU 构建
    needs: release-plan
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ needs.release-plan.outputs.release_tag }}
      GROK_VERSION: ${{ needs.release-plan.outputs.grok_version }}
      PACKAGE_NAME: ${{ needs.release-plan.outputs.package_name }}
      ZIP_NAME: ${{ needs.release-plan.outputs.zip_name }}
      LEGACY_RELEASE: ${{ needs.release-plan.outputs.legacy_release }}
      CARGO_BUILD_JOBS: "4"
      CARGO_CACHE_SCHEMA: v2
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RUSTUP_TOOLCHAIN: 1.94.0-x86_64-pc-windows-gnu
      TARGET: x86_64-pc-windows-gnu
    steps:
      - name: 检出已验证的发布提交
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ needs.release-plan.outputs.source_commit }}

      - name: 准备 Windows GNU 发布环境
        id: windows_setup
        uses: ./.github/actions/setup-windows-gnu
        with:
          version: ${{ needs.release-plan.outputs.grok_version }}

      - name: 恢复 Cargo GNU release-dist 缓存
        id: cargo_target_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/grok-zh-target/${{ env.TARGET }}/release-dist
          key: grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-ltothin-debug0-cgu1-opt3-feature-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-ltothin-debug0-cgu1-opt3-feature-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-zh-dev-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-ltothin-debug0-cgu1-opt3-feature-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-zh-dev-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-ltothin-debug0-cgu1-opt3-feature-release-dist-

      # Explicit --target builds keep proc macros and build scripts outside the
      # target triple directory. Cache them separately to retain old cache hits.
      - name: 恢复 Cargo GNU 宿主构建缓存
        id: cargo_host_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/grok-zh-target/release-dist
          key: grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-ltothin-debug0-cgu1-opt3-feature-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-ltothin-debug0-cgu1-opt3-feature-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-zh-dev-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-ltothin-debug0-cgu1-opt3-feature-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml') }}-
            grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-zh-dev-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-ltothin-debug0-cgu1-opt3-feature-release-dist-

      - name: 记录 Windows Release 缓存命中
        shell: pwsh
        env:
          CARGO_HOME_CACHE_HIT: ${{ steps.windows_setup.outputs.cargo-home-cache-hit }}
          CARGO_HOME_CACHE_KEY: ${{ steps.windows_setup.outputs.cargo-home-cache-matched-key }}
          CARGO_TARGET_CACHE_HIT: ${{ steps.cargo_target_cache.outputs.cache-hit }}
          CARGO_TARGET_CACHE_KEY: ${{ steps.cargo_target_cache.outputs.cache-matched-key }}
          CARGO_HOST_CACHE_HIT: ${{ steps.cargo_host_cache.outputs.cache-hit }}
          CARGO_HOST_CACHE_KEY: ${{ steps.cargo_host_cache.outputs.cache-matched-key }}
        run: |
          @"
          ### Windows Release Cargo caches

          - Dependencies: exact=$env:CARGO_HOME_CACHE_HIT; key=$env:CARGO_HOME_CACHE_KEY
          - Target: exact=$env:CARGO_TARGET_CACHE_HIT; key=$env:CARGO_TARGET_CACHE_KEY
          - Host: exact=$env:CARGO_HOST_CACHE_HIT; key=$env:CARGO_HOST_CACHE_KEY
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: 准备只读 Rust 内容缓存
        uses: ./.github/actions/setup-windows-rust-cache
        with:
          save-cache: 'false'

      - name: 构建 grok-zh
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --frozen --timings -j $env:CARGO_BUILD_JOBS `
            --target $env:TARGET `
            -p xai-grok-pager-bin `
            --profile release-dist `
            --features release-dist `
            --config profile.release-dist.debug=0
          if ($LASTEXITCODE -ne 0) {
            throw "Cargo Release 构建失败：$LASTEXITCODE"
          }

      - name: 汇总 Rust 内容缓存诊断
        if: ${{ !cancelled() }}
        shell: pwsh
        run: python .github/scripts/windows-rust-cache.py finish

      - name: 上传 Windows Release 编译诊断
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grok-zh-windows-release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grok-zh-target/cargo-timings
          if-no-files-found: warn
          retention-days: 14

      - name: 生成并验证完整安装 ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $package = Join-Path $dist $env:PACKAGE_NAME
          New-Item -ItemType Directory -Path $package -Force | Out-Null

          $builtExe = Join-Path $env:CARGO_TARGET_DIR "$env:TARGET\release-dist\grok-zh.exe"
          if (!(Test-Path -LiteralPath $builtExe)) {
            throw "缺少构建出的可执行文件：$builtExe"
          }
          $packageExe = Join-Path $package 'grok-zh.exe'
          $symbolsRoot = Join-Path $env:RUNNER_TEMP 'grok-zh-windows-symbols'
          python .github/scripts/strip-windows-binary.py `
            --input $builtExe --output $packageExe --strip 'C:\mingw64\bin\strip.exe' `
            --version $env:GROK_VERSION --symbols-dir $symbolsRoot
          if ($LASTEXITCODE -ne 0) {
            throw "EXE 精简及冒烟检查失败：$LASTEXITCODE"
          }

          Copy-Item -LiteralPath 'packaging\windows\agent-zh.cmd' -Destination $package
          Copy-Item -LiteralPath 'packaging\windows\一键安装.cmd' -Destination $package
          Copy-Item -LiteralPath 'packaging\windows\[可选]替换原始启动方式.cmd' -Destination $package
          Copy-Item -LiteralPath 'packaging\windows\Install-GrokZh.ps1' -Destination $package
          Copy-Item -LiteralPath 'packaging\windows\INSTALL-WINDOWS.md' -Destination $package

          $rgVersion = '15.1.0'
          $rgArchive = Join-Path $env:RUNNER_TEMP 'ripgrep.zip'
          $rgExtract = Join-Path $env:RUNNER_TEMP 'ripgrep'
          Invoke-WebRequest `
            -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$rgVersion/ripgrep-$rgVersion-x86_64-pc-windows-msvc.zip" `
            -OutFile $rgArchive
          Expand-Archive -LiteralPath $rgArchive -DestinationPath $rgExtract
          $rgSource = Get-ChildItem $rgExtract -Filter rg.exe -Recurse -File |
            Select-Object -First 1
          if (!$rgSource) {
            throw '下载的 ripgrep 压缩包不包含 rg.exe。'
          }
          $rgHash = (Get-FileHash $rgSource.FullName -Algorithm SHA256).Hash
          if ($rgHash -ne 'DECDD4992F3F1B9A5EF9898F1B40AB16886D579D6516B4EFD3D5EAA19364E408') {
            throw "ripgrep SHA-256 校验值异常：$rgHash"
          }
          Copy-Item $rgSource.FullName (Join-Path $package 'rg.exe')

          Copy-Item 'LICENSE' (Join-Path $package 'LICENSE-grok-build.txt')
          $licenseRoot = Join-Path $package 'licenses'
          $rgLicenseDir = Join-Path $licenseRoot 'ripgrep'
          $projectNoticeDir = Join-Path $licenseRoot 'project'
          New-Item -ItemType Directory -Path $rgLicenseDir,$projectNoticeDir -Force | Out-Null
          foreach ($licenseName in @('COPYING', 'LICENSE-MIT', 'UNLICENSE')) {
            $license = Get-ChildItem $rgExtract -Filter $licenseName -Recurse -File |
              Select-Object -First 1
            if (!$license) {
              throw "下载的 ripgrep 压缩包缺少许可证文件：$licenseName"
            }
            Copy-Item $license.FullName $rgLicenseDir
          }
          Copy-Item 'THIRD-PARTY-NOTICES' $projectNoticeDir
          Copy-Item 'crates\codegen\xai-grok-tools\THIRD_PARTY_NOTICES.md' $projectNoticeDir
          Copy-Item 'third_party\NOTICE' $projectNoticeDir

          $signature = (Get-AuthenticodeSignature $packageExe).Status
          $pe = (& 'C:\mingw64\bin\objdump.exe' -f $packageExe |
            Select-String 'file format').Line.Trim()
          $sourceRev = (Get-Content -LiteralPath 'SOURCE_REV' -Raw).Trim()
          @"
          Grok Build 中文社区版 GitHub Release
          Version: $env:GROK_VERSION
          Tag: $env:RELEASE_TAG
          Commit: $env:GITHUB_SHA
          Upstream source revision: $sourceRev
          Repository: $env:GITHUB_REPOSITORY
          Target: $env:TARGET
          Profile: release-dist (Thin LTO, opt-level=3, codegen-units=1, debug=0; release-dist features)
          Symbols: stripped; runtime PE sections verified unchanged
          Cargo jobs: $env:CARGO_BUILD_JOBS
          PE: $pe
          Authenticode: $signature
          GitHub Immutable Release required: true
          GitHub Actions artifact attestation required: true
          Executable smoke-tested by CI: true (--version, --help, agent --help, update --help)
          Default commands after installation: grok-zh, agent-zh
          "@.Trim() | Set-Content (Join-Path $package 'BUILD-INFO.txt') -Encoding utf8

          if ($env:LEGACY_RELEASE -ne 'true') {
            python .github/scripts/write-package-protocol.py --package $package --version $env:GROK_VERSION --platform $env:TARGET
            if ($LASTEXITCODE -ne 0) { throw '生成包内更新协议失败。' }
          }

          $legacyManifestNames = @(
            'grok-zh.exe',
            'agent-zh.cmd',
            'rg.exe',
            '一键安装.cmd',
            '[可选]替换原始启动方式.cmd',
            'Install-GrokZh.ps1',
            'INSTALL-WINDOWS.md'
          )
          $completeManifestNames = @(
            $legacyManifestNames
            'LICENSE-grok-build.txt',
            'BUILD-INFO.txt',
            'licenses/ripgrep/COPYING',
            'licenses/ripgrep/LICENSE-MIT',
            'licenses/ripgrep/UNLICENSE',
            'licenses/project/THIRD-PARTY-NOTICES',
            'licenses/project/THIRD_PARTY_NOTICES.md',
            'licenses/project/NOTICE'
          )
          $manifestNames = if ($env:LEGACY_RELEASE -eq 'true') {
            $legacyManifestNames
          } else {
            $completeManifestNames
          }
          $manifest = foreach ($name in $manifestNames) {
            $hash = (Get-FileHash -LiteralPath (Join-Path $package $name) -Algorithm SHA256).Hash
            "$hash  $name"
          }
          $manifest | Set-Content (Join-Path $package 'SHA256SUMS.txt') -Encoding utf8

          if (Get-ChildItem $package -Filter '*.zip' -Recurse -File) {
            throw '安装包目录不得包含嵌套 ZIP。'
          }

          $zipName = "$env:PACKAGE_NAME.zip"
          $zipPath = Join-Path $dist $zipName
          # Standard Deflate at level 9: compatible with existing ZIP readers.
          # Keep the legacy flat archive and modern single-root layout intact.
          [IO.Compression.ZipFile]::CreateFromDirectory(
            $package, $zipPath, [IO.Compression.CompressionLevel]::SmallestSize,
            ($env:LEGACY_RELEASE -ne 'true')
          )

          $verifyRoot = Join-Path $env:RUNNER_TEMP "grok-zh-release-zip-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $verifyRoot) {
            throw "ZIP 验证目录已存在：$verifyRoot"
          }
          New-Item -ItemType Directory -Path $verifyRoot | Out-Null
          Expand-Archive -LiteralPath $zipPath -DestinationPath $verifyRoot
          if ($env:LEGACY_RELEASE -eq 'true') {
            $packageRoot = $verifyRoot
          } else {
            $rootFiles = @(Get-ChildItem -LiteralPath $verifyRoot -File -Force)
            $rootDirectories = @(Get-ChildItem -LiteralPath $verifyRoot -Directory -Force)
            if ($rootFiles.Count -ne 0 -or $rootDirectories.Count -ne 1 -or
                $rootDirectories[0].Name -cne $env:PACKAGE_NAME) {
              throw "后续 Release ZIP 必须只包含一个同名顶层目录：$env:PACKAGE_NAME"
            }
            $packageRoot = $rootDirectories[0].FullName
          }
          $required = @(
            'grok-zh.exe',
            'agent-zh.cmd',
            'rg.exe',
            '一键安装.cmd',
            '[可选]替换原始启动方式.cmd',
            'Install-GrokZh.ps1',
            'INSTALL-WINDOWS.md',
            'LICENSE-grok-build.txt',
            'BUILD-INFO.txt',
            'licenses/ripgrep/COPYING',
            'licenses/ripgrep/LICENSE-MIT',
            'licenses/ripgrep/UNLICENSE',
            'licenses/project/THIRD-PARTY-NOTICES',
            'licenses/project/THIRD_PARTY_NOTICES.md',
            'licenses/project/NOTICE'
          )
          $approvedManifestNames = if ($env:LEGACY_RELEASE -eq 'true') {
            $required[0..6]
          } else {
            $required
          }
          $manifestPath = Join-Path $packageRoot 'SHA256SUMS.txt'
          if (!(Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw 'Release ZIP 包目录缺少 SHA256SUMS.txt。'
          }
          $manifestHashes = [Collections.Generic.Dictionary[string, string]]::new(
            [StringComparer]::Ordinal
          )
          $normalizedNames = [Collections.Generic.HashSet[string]]::new(
            [StringComparer]::Ordinal
          )
          $allowedUnicodeNames = @('一键安装.cmd', '[可选]替换原始启动方式.cmd')
          $lineNumber = 0
          foreach ($rawLine in (Get-Content -LiteralPath $manifestPath -Encoding UTF8)) {
            $lineNumber++
            $line = $rawLine.TrimStart([char]0xFEFF)
            $match = [regex]::Match($line, '^(?<hash>[0-9A-Fa-f]{64})  (?<name>[^\\]+)$')
            if (!$match.Success) {
              throw "SHA256SUMS.txt 第 $lineNumber 行格式无效。"
            }
            $name = $match.Groups['name'].Value
            $isAscii = $name -cmatch '^[\x00-\x7F]+$'
            $pathParts = $name.Split('/')
            if ($name.Trim() -ne $name -or
                $name.StartsWith('/') -or
                $name.Contains(':') -or
                $pathParts.Count -eq 0 -or
                ($pathParts | Where-Object { $_ -in @('', '.', '..') }).Count -ne 0 -or
                $approvedManifestNames -cnotcontains $name -or
                (!$isAscii -and $allowedUnicodeNames -cnotcontains $name)) {
              throw "SHA256SUMS.txt 包含不安全或未批准的文件名：$name"
            }
            $normalizedName = if ($isAscii) {
              $name.ToLowerInvariant()
            } else {
              $name
            }
            if (!$normalizedNames.Add($normalizedName)) {
              throw "SHA256SUMS.txt 包含重复文件名：$name"
            }
            $file = Join-Path $packageRoot $name
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Release ZIP 缺少清单文件：$name"
            }
            $actualHash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash
            if ($actualHash -ne $match.Groups['hash'].Value) {
              throw "Release ZIP 内层 SHA-256 不匹配：$name"
            }
            $manifestHashes.Add($name, $actualHash)
          }
          foreach ($name in $approvedManifestNames) {
            if (!$manifestHashes.ContainsKey($name)) {
              throw "Release ZIP 清单缺少必需文件：$name"
            }
          }
          $expectedFiles = @($required + 'SHA256SUMS.txt')
          $actualFiles = @(Get-ChildItem -LiteralPath $packageRoot -Recurse -File -Force | ForEach-Object {
            [IO.Path]::GetRelativePath($packageRoot, $_.FullName).Replace(
              [IO.Path]::DirectorySeparatorChar,
              '/'
            )
          })
          $missingFiles = @($expectedFiles | Where-Object { $actualFiles -cnotcontains $_ })
          $extraFiles = @($actualFiles | Where-Object { $expectedFiles -cnotcontains $_ })
          if ($missingFiles.Count -ne 0 -or $extraFiles.Count -ne 0) {
            throw "Release ZIP 文件集合不精确；缺少：$($missingFiles -join ', ')；额外：$($extraFiles -join ', ')"
          }
          $verifyExe = Join-Path $packageRoot 'grok-zh.exe'
          $versionOutput = (& $verifyExe --version | Select-Object -First 1).Trim()
          if ($LASTEXITCODE -ne 0 -or
              $versionOutput -notmatch "^grok-zh $([regex]::Escape($env:GROK_VERSION)) \(") {
            throw "Release ZIP 中的 grok-zh.exe 版本冒烟失败：$versionOutput"
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          foreach ($asset in @($zipPath)) {
            $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            $name = Split-Path $asset -Leaf
            [IO.File]::WriteAllText("$asset.sha256", "$hash  $name", $utf8NoBom)
          }
          "DIST_DIR=$dist" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "ZIP_NAME=$zipName" | Out-File $env:GITHUB_ENV -Append -Encoding utf8


      - name: 上传独立 Windows 符号诊断
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grok-zh-windows-release-symbols-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grok-zh-windows-symbols
          if-no-files-found: warn
          compression-level: 9
          retention-days: 14

      - name: 上传 Windows Release 资产
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.release-plan.outputs.windows_artifact_name }}
          path: |
            dist/${{ needs.release-plan.outputs.zip_name }}
            dist/${{ needs.release-plan.outputs.zip_name }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos-arm-release:
    name: macOS ARM64 构建
    needs: release-plan
    if: ${{ needs.release-plan.outputs.include_macos == 'true' }}
    runs-on: macos-15
    timeout-minutes: 240
    outputs:
      package_name: ${{ steps.build.outputs.package_name }}
      archive_name: ${{ steps.build.outputs.archive_name }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_CACHE_SCHEMA: macos-arm-v1
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      RUSTUP_TOOLCHAIN: 1.94.0-aarch64-apple-darwin
      TARGET: aarch64-apple-darwin
    steps:
      - name: 检出发布标签
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.release-plan.outputs.source_commit }}

      - name: 构建并验证 macOS ARM64
        id: build
        uses: ./.github/actions/build-macos-arm
        with:
          version: ${{ needs.release-plan.outputs.grok_version }}
          release_build: 'true'

  linux-x64-gnu-release:
    name: Linux x64 GNU 构建
    needs: release-plan
    if: ${{ needs.release-plan.outputs.include_linux == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      package_name: ${{ steps.build.outputs.package_name }}
      archive_name: ${{ steps.build.outputs.archive_name }}
      artifact_name: ${{ steps.build.outputs.artifact_name }}
    env:
      CARGO_BUILD_JOBS: "3"
      CARGO_CACHE_SCHEMA: linux-x64-v1
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      CARGO_HTTP_TIMEOUT: "120"
      DOTSLASH_VERSION: "0.5.9"
      DOTSLASH_SHA256: 7400dd0dbdf05d3be4e604b62807eb1bcbaa0d1bced010d30746243759e0ac03
      RUSTUP_TOOLCHAIN: 1.94.0-x86_64-unknown-linux-gnu
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: 检出发布标签
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.release-plan.outputs.source_commit }}

      - name: 构建并验证 Linux x64 GNU
        id: build
        uses: ./.github/actions/build-linux-x64
        with:
          version: ${{ needs.release-plan.outputs.grok_version }}
          release_build: 'true'

  release-attestations:
    name: 生成 Release 资产构建来源证明
    needs:
      - release-plan
      - windows-x64-gnu-validation
      - windows-x64-gnu
      - macos-arm-release
      - linux-x64-gnu-release
    if: >-
      ${{
        !cancelled() &&
        needs.release-plan.result == 'success' &&
        needs.windows-x64-gnu-validation.result == 'success' &&
        needs.windows-x64-gnu.result == 'success' &&
        (
          needs.macos-arm-release.result == 'success' ||
          (
            needs.macos-arm-release.result == 'skipped' &&
            needs.release-plan.outputs.include_macos == 'false'
          )
        ) &&
        (
          needs.linux-x64-gnu-release.result == 'success' ||
          (
            needs.linux-x64-gnu-release.result == 'skipped' &&
            needs.release-plan.outputs.include_linux == 'false'
          )
        )
      }}
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      ZIP_NAME: ${{ needs.release-plan.outputs.zip_name }}
      MAC_ARCHIVE_NAME: ${{ needs.macos-arm-release.outputs.archive_name }}
      LINUX_ARCHIVE_NAME: ${{ needs.linux-x64-gnu-release.outputs.archive_name }}
    steps:
      - name: 下载 Windows Release 资产
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release-plan.outputs.windows_artifact_name }}
          path: dist

      - name: 下载 macOS Release 资产
        if: ${{ needs.release-plan.outputs.include_macos == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.macos-arm-release.outputs.artifact_name }}
          path: dist

      - name: 下载 Linux Release 资产
        if: ${{ needs.release-plan.outputs.include_linux == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.linux-x64-gnu-release.outputs.artifact_name }}
          path: dist

      - name: 为 Windows Release 资产生成构建来源证明
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/dist/${{ env.ZIP_NAME }}
            ${{ github.workspace }}/dist/${{ env.ZIP_NAME }}.sha256

      - name: 为 macOS Release 资产生成构建来源证明
        if: ${{ needs.release-plan.outputs.include_macos == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/dist/${{ env.MAC_ARCHIVE_NAME }}
            ${{ github.workspace }}/dist/${{ env.MAC_ARCHIVE_NAME }}.sha256

      - name: 为 Linux Release 资产生成构建来源证明
        if: ${{ needs.release-plan.outputs.include_linux == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ github.workspace }}/dist/${{ env.LINUX_ARCHIVE_NAME }}
            ${{ github.workspace }}/dist/${{ env.LINUX_ARCHIVE_NAME }}.sha256

  release-publisher:
    name: 核验并发布唯一 Release
    needs:
      - release-plan
      - windows-x64-gnu-validation
      - windows-x64-gnu
      - macos-arm-release
      - linux-x64-gnu-release
      - release-attestations
    if: >-
      ${{
        !cancelled() &&
        needs.release-plan.result == 'success' &&
        needs.windows-x64-gnu-validation.result == 'success' &&
        needs.windows-x64-gnu.result == 'success' &&
        needs.release-attestations.result == 'success' &&
        (
          needs.macos-arm-release.result == 'success' ||
          (
            needs.macos-arm-release.result == 'skipped' &&
            needs.release-plan.outputs.include_macos == 'false'
          )
        ) &&
        (
          needs.linux-x64-gnu-release.result == 'success' ||
          (
            needs.linux-x64-gnu-release.result == 'skipped' &&
            needs.release-plan.outputs.include_linux == 'false'
          )
        )
      }}
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ needs.release-plan.outputs.release_tag }}
      GROK_VERSION: ${{ needs.release-plan.outputs.grok_version }}
      ZIP_NAME: ${{ needs.release-plan.outputs.zip_name }}
      MAC_ARCHIVE_NAME: ${{ needs.macos-arm-release.outputs.archive_name }}
      LINUX_ARCHIVE_NAME: ${{ needs.linux-x64-gnu-release.outputs.archive_name }}
      INCLUDE_MACOS: ${{ needs.release-plan.outputs.include_macos }}
      INCLUDE_LINUX: ${{ needs.release-plan.outputs.include_linux }}
      IS_PRERELEASE: ${{ needs.release-plan.outputs.is_prerelease }}
      DIST_DIR: ${{ github.workspace }}\dist
      RELEASE_NOTES_PATH: ${{ github.workspace }}\release-notes\release-notes.md
      PUBLISH_LEGACY_SHA256: ${{ needs.release-plan.outputs.publish_legacy_sha256 }}
    steps:
      - name: 下载 Windows Release 资产
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release-plan.outputs.windows_artifact_name }}
          path: dist

      - name: 下载 Release 更新日志
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release-plan.outputs.notes_artifact_name }}
          path: release-notes

      - name: 下载 macOS Release 资产
        if: ${{ needs.release-plan.outputs.include_macos == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.macos-arm-release.outputs.artifact_name }}
          path: dist

      - name: 下载 Linux Release 资产
        if: ${{ needs.release-plan.outputs.include_linux == 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.linux-x64-gnu-release.outputs.artifact_name }}
          path: dist

      - name: 创建 Draft、核验资产并发布
        id: publish
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $dist = $env:DIST_DIR
          $assets = @(
            (Join-Path $dist $env:ZIP_NAME),
            (Join-Path $dist "$env:ZIP_NAME.sha256")
          )
          if ($env:INCLUDE_MACOS -eq 'true') {
            $assets += @(
              (Join-Path $dist $env:MAC_ARCHIVE_NAME),
              (Join-Path $dist "$env:MAC_ARCHIVE_NAME.sha256")
            )
          }
          if ($env:INCLUDE_LINUX -eq 'true') {
            $assets += @(
              (Join-Path $dist $env:LINUX_ARCHIVE_NAME),
              (Join-Path $dist "$env:LINUX_ARCHIVE_NAME.sha256")
            )
          }
          $notes = $env:RELEASE_NOTES_PATH
          if (!(Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "缺少预生成的 Release 更新日志：$notes"
          }
          foreach ($assetPath in $assets) {
            if (!(Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "缺少待发布资产：$assetPath"
            }
          }
          function Assert-ChecksumSidecar([string]$archivePath) {
            $sidecarPath = "$archivePath.sha256"
            $archiveName = Split-Path $archivePath -Leaf
            $sidecarLines = @(Get-Content -LiteralPath $sidecarPath -Encoding UTF8)
            if ($sidecarLines.Count -ne 1 -or
                $sidecarLines[0] -cnotmatch '^(?<hash>[0-9a-f]{64})  (?<name>[^\\/]+)$' -or
                $matches.name -cne $archiveName) {
              throw "校验文件格式或目标文件名无效：$sidecarPath"
            }
            $archiveHash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($matches.hash -cne $archiveHash) {
              throw "校验文件内容与资产 SHA-256 不一致：$sidecarPath"
            }
          }
          Assert-ChecksumSidecar (Join-Path $dist $env:ZIP_NAME)
          if ($env:INCLUDE_MACOS -eq 'true') {
            Assert-ChecksumSidecar (Join-Path $dist $env:MAC_ARCHIVE_NAME)
          }
          if ($env:INCLUDE_LINUX -eq 'true') {
            Assert-ChecksumSidecar (Join-Path $dist $env:LINUX_ARCHIVE_NAME)
          }
          $expectedLocalNames = @($assets | ForEach-Object { Split-Path $_ -Leaf })
          [Array]::Sort($expectedLocalNames, [StringComparer]::Ordinal)
          $actualLocalNames = @(
            Get-ChildItem -LiteralPath $dist -File | ForEach-Object Name
          )
          [Array]::Sort($actualLocalNames, [StringComparer]::Ordinal)
          if (($expectedLocalNames -join "`n") -cne ($actualLocalNames -join "`n")) {
            throw "发布目录不是精确资产集合：$($actualLocalNames -join ', ')"
          }
          # Sidecars remain internal build/attestation inputs after retirement.
          # The public asset list, including all later API checks, uses archives only.
          if ($env:PUBLISH_LEGACY_SHA256 -eq 'false') {
            $assets = @($assets | Where-Object { !$_.EndsWith('.sha256', [StringComparison]::Ordinal) })
          } elseif ($env:PUBLISH_LEGACY_SHA256 -ne 'true') {
            throw '发布计划未提供明确的独立校验文件策略。'
          }

          $releasePages = @(
            gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" |
              ConvertFrom-Json
          )
          if ($LASTEXITCODE -ne 0) {
            throw "发布前无法读取现有 Release 列表：$LASTEXITCODE"
          }
          $existing = @(
            foreach ($page in $releasePages) {
              foreach ($candidate in @($page)) {
                if ($candidate.tag_name -ceq $env:RELEASE_TAG) { $candidate }
              }
            }
          )
          if ($existing.Count -ne 0) {
            throw "Release $env:RELEASE_TAG 已存在；不可变发布不得覆盖。"
          }

          function Resolve-RemoteTagCommit {
            $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG" |
              ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw '无法读取远端 Tag 引用。' }
            $object = $ref.object
            for ($depth = 0; $object.type -ceq 'tag' -and $depth -lt 8; $depth++) {
              $tagObject = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($object.sha)" |
                ConvertFrom-Json
              if ($LASTEXITCODE -ne 0) { throw '无法解引用 annotated Tag。' }
              $object = $tagObject.object
            }
            if ($object.type -cne 'commit') {
              throw "远端 Tag 未指向 commit：type=$($object.type)"
            }
            return [string]$object.sha
          }
          $remoteTagCommit = Resolve-RemoteTagCommit
          if ($remoteTagCommit -cne $env:GITHUB_SHA) {
            throw "发布前远端 Tag 必须仍指向工作流提交：tag=$remoteTagCommit workflow=$env:GITHUB_SHA"
          }

          $createArgs = @(
            'release', 'create', $env:RELEASE_TAG
          ) + $assets + @(
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag', '--draft',
            '--title', $env:GROK_VERSION,
            '--notes-file', $notes
          )
          & gh @createArgs
          if ($LASTEXITCODE -ne 0) {
            throw "创建 Draft Release 失败：$LASTEXITCODE"
          }
          # GitHub's tag lookup endpoint does not expose draft releases. Enumerate
          # the authenticated release list and require one exact draft instead.
          $releaseMatches = @()
          for ($attempt = 0; $attempt -lt 15; $attempt++) {
            $releasePages = @(
              gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" |
                ConvertFrom-Json
            )
            $releaseMatches = @(
              foreach ($page in $releasePages) {
                foreach ($candidate in @($page)) {
                  if ($candidate.tag_name -ceq $env:RELEASE_TAG -and $candidate.draft) {
                    $candidate
                  }
                }
              }
            )
            if ($releaseMatches.Count -eq 1) { break }
            Start-Sleep -Seconds 2
          }
          if ($releaseMatches.Count -ne 1) {
            throw "没有找到唯一的 Draft Release：$env:RELEASE_TAG"
          }
          $releaseId = $releaseMatches[0].id
          "release_id=$releaseId" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          $release = $null
          for ($attempt = 0; $attempt -lt 15; $attempt++) {
            $releaseJson = (& gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" 2>$null) -join "`n"
            if ($LASTEXITCODE -eq 0 -and $releaseJson) {
              try {
                $candidate = $releaseJson | ConvertFrom-Json
                $candidateAssets = @($candidate.assets)
                $assetsReady = $candidateAssets.Count -eq $assets.Count -and
                  @(
                    $candidateAssets | Where-Object {
                      $_.state -cne 'uploaded' -or $_.digest -cnotmatch '^sha256:[0-9a-f]{64}$'
                    }
                  ).Count -eq 0
                if ($assetsReady) {
                  $release = $candidate
                  break
                }
              } catch {
                $release = $null
              }
            }
            Start-Sleep -Seconds 2
          }
          if ($null -eq $release) {
            throw "Draft Release 的资产未在等待期内进入 uploaded 状态并生成 SHA-256 digest。"
          }
          if (!$release.draft -or $release.tag_name -cne $env:RELEASE_TAG) {
            throw 'Draft Release 元数据与 Tag 不一致。'
          }
          $expectedNotes = (Get-Content -LiteralPath $notes -Raw).Trim()
          if ($release.name -cne $env:GROK_VERSION -or $release.body.Trim() -cne $expectedNotes) {
            throw 'Draft Release 的标题或正文与预生成更新日志不一致。'
          }
          $expectedNames = @($assets | ForEach-Object { Split-Path $_ -Leaf })
          [Array]::Sort($expectedNames, [StringComparer]::Ordinal)
          $actualNames = @($release.assets | ForEach-Object name)
          [Array]::Sort($actualNames, [StringComparer]::Ordinal)
          if (($expectedNames -join "`n") -cne ($actualNames -join "`n")) {
            throw "Release 资产集合不匹配：$($actualNames -join ', ')"
          }
          foreach ($asset in $release.assets) {
            if ($asset.state -cne 'uploaded' -or $asset.digest -cnotmatch '^sha256:[0-9a-f]{64}$') {
              throw "GitHub 未完成 $($asset.name) 的上传或 SHA-256 记录。"
            }
            $remoteHash = $asset.digest.Substring('sha256:'.Length)
            $localHash = (Get-FileHash (Join-Path $dist $asset.name) -Algorithm SHA256).Hash
            if ($remoteHash -cne $localHash.ToLowerInvariant()) {
              throw "$($asset.name) 的本地哈希与 GitHub digest 不一致。"
            }
          }

          # Re-read the exact captured Draft immediately before publication.
          # Publishing by numeric ID avoids editing a replacement Release that
          # happens to reuse the same Tag name.
          $beforePublish = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId" |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$beforePublish.draft -or
              [int64]$beforePublish.id -ne [int64]$releaseId -or
              $beforePublish.tag_name -cne $env:RELEASE_TAG -or
              $beforePublish.name -cne $env:GROK_VERSION -or
              $beforePublish.body.Trim() -cne $expectedNotes) {
            throw '发布前 Draft Release 的身份或元数据发生变化。'
          }
          $beforeNames = @($beforePublish.assets | ForEach-Object name)
          [Array]::Sort($beforeNames, [StringComparer]::Ordinal)
          if (($expectedNames -join "`n") -cne ($beforeNames -join "`n")) {
            throw '发布前 Draft Release 的资产集合发生变化。'
          }
          foreach ($asset in $beforePublish.assets) {
            $localHash = (Get-FileHash (Join-Path $dist $asset.name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.state -cne 'uploaded' -or
                $asset.digest -cnotmatch '^sha256:[0-9a-f]{64}$' -or
                $asset.digest.Substring('sha256:'.Length) -cne $localHash) {
              throw "发布前 $($asset.name) 的状态或 digest 发生变化。"
            }
          }
          $remoteTagCommit = Resolve-RemoteTagCommit
          if ($remoteTagCommit -cne $env:GITHUB_SHA) {
            throw "发布前远端 Tag 指向发生变化：tag=$remoteTagCommit workflow=$env:GITHUB_SHA"
          }

          $isPrerelease = $env:IS_PRERELEASE -eq 'true'
          $publishArgs = @(
            'api', '--method', 'PATCH',
            "repos/$env:GITHUB_REPOSITORY/releases/$releaseId",
            '-F', 'draft=false',
            '-F', "prerelease=$($isPrerelease.ToString().ToLowerInvariant())",
            '-f', "make_latest=$(if ($isPrerelease) { 'false' } else { 'true' })"
          )
          $publishJson = (& gh @publishArgs) -join "`n"
          if ($LASTEXITCODE -ne 0) {
            throw "发布 Release 失败：$LASTEXITCODE"
          }
          $publishResult = $publishJson | ConvertFrom-Json
          if ([int64]$publishResult.id -ne [int64]$releaseId -or [bool]$publishResult.draft) {
            throw '发布 API 返回了错误的 Release 身份或仍处于 Draft 状态。'
          }

          $published = $null
          for ($attempt = 0; $attempt -lt 30; $attempt++) {
            $publishedJson = (& gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$env:RELEASE_TAG" 2>$null) -join "`n"
            if ($LASTEXITCODE -eq 0 -and $publishedJson) {
              try {
                $candidate = $publishedJson | ConvertFrom-Json
                if ($null -ne $candidate) {
                  $published = $candidate
                  if ([bool]$published.immutable) { break }
                }
              } catch {
                $published = $null
              }
            }
            Start-Sleep -Seconds 2
          }
          if ($null -eq $published -or [int64]$published.id -ne [int64]$releaseId -or
              [bool]$published.draft -or ![bool]$published.immutable) {
            throw 'Release 发布后未进入 immutable 状态。'
          }
          if ([bool]$published.prerelease -ne [bool]($env:IS_PRERELEASE -eq 'true')) {
            throw 'Release prerelease 状态与 SemVer 不一致。'
          }
          if ($published.tag_name -cne $env:RELEASE_TAG -or
              $published.name -cne $env:GROK_VERSION -or
              $published.body.Trim() -cne $expectedNotes) {
            throw 'Release 发布后的 Tag、标题或正文与已核验 Draft 不一致。'
          }
          $publishedNames = @($published.assets | ForEach-Object name)
          [Array]::Sort($publishedNames, [StringComparer]::Ordinal)
          if (($expectedNames -join "`n") -cne ($publishedNames -join "`n")) {
            throw 'Release 发布后的资产集合与已核验 Draft 不一致。'
          }
          foreach ($asset in $published.assets) {
            if ($asset.state -cne 'uploaded' -or $asset.digest -cnotmatch '^sha256:[0-9a-f]{64}$') {
              throw "Release 发布后 $($asset.name) 未保持 uploaded 状态或缺少规范 SHA-256 digest。"
            }
            $localHash = (Get-FileHash (Join-Path $dist $asset.name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($asset.digest.Substring('sha256:'.Length) -cne $localHash) {
              throw "Release 发布后 $($asset.name) 的 digest 与本地资产不一致。"
            }
          }
          foreach ($assetPath in $assets) {
            $verified = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              & gh attestation verify $assetPath `
                --repo $env:GITHUB_REPOSITORY `
                --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/zh-release-windows.yml" `
                --source-ref "refs/tags/$env:RELEASE_TAG"
              if ($LASTEXITCODE -eq 0) {
                $verified = $true
                break
              }
              if ($attempt -lt 5) {
                $delay = 5 * [Math]::Pow(2, $attempt - 1)
                Write-Warning "构建来源证明暂未可用，将在 $delay 秒后重试（$attempt/5）：$assetPath"
                Start-Sleep -Seconds $delay
              }
            }
            if (-not $verified) {
              throw "Release 资产的构建来源证明验证失败：$assetPath"
            }
          }
          $remoteTagCommit = Resolve-RemoteTagCommit
          if ($remoteTagCommit -cne $env:GITHUB_SHA) {
            throw "Release 发布后远端 Tag 指向发生变化：tag=$remoteTagCommit workflow=$env:GITHUB_SHA"
          }

      - name: 失败时清理本次遗留的 Draft Release
        if: ${{ failure() || cancelled() }}
        shell: pwsh
        env:
          CREATED_RELEASE_ID: ${{ steps.publish.outputs.release_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = $null
          if (![string]::IsNullOrWhiteSpace($env:CREATED_RELEASE_ID)) {
            $releaseJson = (& gh api "repos/$env:GITHUB_REPOSITORY/releases/$env:CREATED_RELEASE_ID" 2>$null) -join "`n"
            if ($LASTEXITCODE -ne 0 -or !$releaseJson) {
              Write-Error "无法核对待清理的 Draft Release：$env:CREATED_RELEASE_ID"
              exit 1
            }
            $release = $releaseJson | ConvertFrom-Json
          } else {
            # The publisher failed before it could persist a numeric ID. There
            # may be no Release yet, or gh release create may have uploaded only
            # part of it. Recover only one exact Draft for this Tag/title;
            # ambiguity is left for manual inspection.
            $releasePages = @(
              gh api --paginate --slurp "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" |
                ConvertFrom-Json
            )
            if ($LASTEXITCODE -ne 0) {
              Write-Error '无法查找本次可能遗留的 Draft Release。'
              exit 1
            }
            $draftMatches = @(
              foreach ($page in $releasePages) {
                foreach ($candidate in @($page)) {
                  if ($candidate.draft -and
                      $candidate.tag_name -ceq $env:RELEASE_TAG -and
                      $candidate.name -ceq $env:GROK_VERSION) {
                    $candidate
                  }
                }
              }
            )
            if ($draftMatches.Count -eq 0) {
              Write-Host '没有找到本次 Tag 的遗留 Draft Release。'
              exit 0
            }
            if ($draftMatches.Count -ne 1) {
              Write-Error "找到 $($draftMatches.Count) 个候选 Draft，拒绝自动删除。"
              exit 1
            }
            $release = $draftMatches[0]
          }
          if ((![string]::IsNullOrWhiteSpace($env:CREATED_RELEASE_ID) -and
               [int64]$release.id -ne [int64]$env:CREATED_RELEASE_ID) -or
              $release.tag_name -cne $env:RELEASE_TAG -or
              $release.name -cne $env:GROK_VERSION -or
              ![bool]$release.draft) {
            Write-Error '本次 Release 已发布或身份发生变化，拒绝自动删除；请人工核对。'
            exit 1
          }
          $deleteId = [int64]$release.id
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$deleteId"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "无法清理遗留 Draft Release：$deleteId"
            exit 1
          }
          Write-Host "已清理遗留 Draft Release：$deleteId"
