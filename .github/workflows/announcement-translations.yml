name: Dynamic translations

on:
  push:
    branches: [zh-dev]
    paths:
      - community/announcements/**
      - community/display-translations/**
      - .github/scripts/validate-display-translations.py
      - .github/scripts/tests/test_display_translations.py
      - .github/scripts/validate-announcement-translations.py
      - .github/scripts/tests/test_announcement_translations.py
      - .github/workflows/announcement-translations.yml
      - .gitattributes
  pull_request:
    branches: [zh-dev]
    paths:
      - community/announcements/**
      - community/display-translations/**
      - .github/scripts/validate-display-translations.py
      - .github/scripts/tests/test_display_translations.py
      - .github/scripts/validate-announcement-translations.py
      - .github/scripts/tests/test_announcement_translations.py
      - .github/workflows/announcement-translations.yml
      - .gitattributes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 轻量检查：同一 PR 的新提交取消该 PR 旧轮；push 与手动运行按 run_id 独立，PR 不会取消 zh-dev。
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Validate immutable catalogs and manifest
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            python3 .github/scripts/validate-announcement-translations.py --base "$BASE_SHA"
            python3 .github/scripts/validate-display-translations.py --base "$BASE_SHA"
          else
            python3 .github/scripts/validate-announcement-translations.py
            python3 .github/scripts/validate-display-translations.py
          fi
      - name: Check validator regressions
        run: |
          python3 -m unittest discover -s .github/scripts/tests -p test_announcement_translations.py
          python3 -m unittest discover -s .github/scripts/tests -p test_display_translations.py
