name: Build Linux x64 GNU
description: 在 GitHub 托管的 Ubuntu runner 上构建并验证 Linux x86_64 GNU 制品
inputs:
  version:
    description: 正式构建使用的严格 SemVer；预览构建留空即可
    required: false
    default: ''
  release_build:
    description: 标记是否由正式发布流程调用
    required: true
outputs:
  package_name:
    value: ${{ steps.package_meta.outputs.package_name }}
  archive_name:
    value: ${{ steps.package_meta.outputs.archive_name }}
  artifact_name:
    value: ${{ steps.package_meta.outputs.artifact_name }}
runs:
  using: composite
  steps:

      - name: 选择构建版本
        id: package_meta
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          IS_RELEASE_BUILD: ${{ inputs.release_build }}
        shell: bash
        run: |
          set -euo pipefail
          requested="$REQUESTED_VERSION"
          if [[ "$IS_RELEASE_BUILD" == "true" \
            && -z "$(printf '%s' "$requested" | tr -d '[:space:]')" ]]; then
            echo "::error::正式构建必须显式提供严格 SemVer 版本。"
            exit 1
          fi
          if [[ -z "$(printf '%s' "$requested" | tr -d '[:space:]')" ]]; then
            package_version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' \
              crates/codegen/xai-grok-pager-bin/Cargo.toml | head -n 1)"
            if [[ -z "$package_version" ]]; then
              echo "::error::无法读取 pager-bin 软件包版本。"
              exit 1
            fi
            version="$package_version-zh.ci.$GITHUB_RUN_NUMBER"
          else
            version="$(printf '%s' "$requested" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          fi
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if (( ${#version} > 64 )) || [[ ! "$version" =~ $semver_pattern ]]; then
            echo "::error::版本无效：$version"
            exit 1
          fi
          package_name="grok-zh-$version-linux-x86_64-gnu"
          archive_name="$package_name.tar.gz"
          {
            echo "GROK_VERSION=$version"
            echo "PACKAGE_NAME=$package_name"
            echo "ARCHIVE_NAME=$archive_name"
          } >> "$GITHUB_ENV"
          {
            echo "package_name=$package_name"
            echo "archive_name=$archive_name"
            echo "artifact_name=$package_name-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_OUTPUT"

      - name: 安装 Linux 构建依赖
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            binutils build-essential ca-certificates clang cmake curl file \
            libasound2-dev libclang-dev libdbus-1-dev libssl-dev nasm pkg-config

      - name: 配置固定版本的 Rust 与构建目录
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUSTUP_TOOLCHAIN" \
            --profile minimal --component rustfmt
          rustup target add --toolchain "$RUSTUP_TOOLCHAIN" "$TARGET"
          cargo_home="$RUNNER_TEMP/grok-zh-cargo"
          target_dir="$RUNNER_TEMP/grok-zh-target"
          dotslash_cache="$RUNNER_TEMP/grok-zh-dotslash"
          tools_dir="$RUNNER_TEMP/grok-zh-tools"
          mkdir -p "$cargo_home" "$target_dir" "$dotslash_cache" "$tools_dir/bin"
          echo "$tools_dir/bin" >> "$GITHUB_PATH"
          {
            echo "CARGO_HOME=$cargo_home"
            echo "CARGO_TARGET_DIR=$target_dir"
            echo "DOTSLASH_CACHE=$dotslash_cache"
            echo "TOOLS_DIR=$tools_dir"
            echo "PROTOC=$GITHUB_WORKSPACE/bin/protoc"
          } >> "$GITHUB_ENV"
          rustc --version --verbose
          cargo --version --verbose

      - name: 恢复 Cargo 依赖与工具缓存
        id: cargo_home_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/grok-zh-cargo/registry
            ${{ runner.temp }}/grok-zh-cargo/git
            ${{ runner.temp }}/grok-zh-dotslash
            ${{ runner.temp }}/grok-zh-tools
          key: grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-dotslash-${{ env.DOTSLASH_VERSION }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-dotslash-${{ env.DOTSLASH_VERSION }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-
            grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-dotslash-${{ env.DOTSLASH_VERSION }}-

      - name: 恢复 Cargo Linux release-dist 缓存
        id: cargo_target_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grok-zh-target/${{ env.TARGET }}/release-dist
          key: grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-
            grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-

      - name: 安装并验证 DotSlash 与 protoc
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -x "$TOOLS_DIR/bin/dotslash" ]]; then
            dotslash_archive="$RUNNER_TEMP/dotslash-ubuntu-22.04.x86_64.tar.gz"
            dotslash_uri="https://github.com/facebook/dotslash/releases/download/v$DOTSLASH_VERSION/dotslash-ubuntu-22.04.x86_64.tar.gz"
            curl --fail --location --retry 5 --retry-all-errors \
              --output "$dotslash_archive" "$dotslash_uri"
            printf '%s  %s\n' "$DOTSLASH_SHA256" "$dotslash_archive" |
              sha256sum -c -
            tar -xzf "$dotslash_archive" -C "$TOOLS_DIR/bin" dotslash
          fi
          chmod 0755 "$TOOLS_DIR/bin/dotslash" "$PROTOC"
          "$TOOLS_DIR/bin/dotslash" --version
          "$PROTOC" --version

      - name: 验证格式与基础本地化
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo fetch --locked --target "$TARGET"
          cargo test --frozen -j "$CARGO_BUILD_JOBS" -p xai-grok-locale
          cargo test --frozen -j "$CARGO_BUILD_JOBS" \
            -p xai-grok-update --features community-build --lib

      - name: 构建 Linux x86_64 GNU
        shell: bash
        run: |
          set -euo pipefail
          cargo build --frozen -j "$CARGO_BUILD_JOBS" \
            --target "$TARGET" \
            -p xai-grok-pager-bin \
            --profile release-dist \
            --features release-dist

      - name: 打包并验证 Linux 构建
        env:
          IS_RELEASE_BUILD: ${{ inputs.release_build }}
        shell: bash
        run: |
          set -euo pipefail
          dist="$GITHUB_WORKSPACE/dist"
          package="$dist/$PACKAGE_NAME"
          built_bin="$CARGO_TARGET_DIR/$TARGET/release-dist/grok-zh"
          mkdir -p "$package"
          chmod 0755 "$package"
          if [[ ! -f "$built_bin" ]]; then
            echo "::error::找不到编译产物：$built_bin"
            exit 1
          fi
          cp "$built_bin" "$package/grok-zh"
          chmod 0755 "$package/grok-zh"
          # release-dist 构建产物保留 DWARF；发布包副本必须在这里移除这些调试段，
          # 否则单个 ELF 会超过旧版社区更新器的 512 MiB 解包安全上限。
          strip --strip-debug -- "$package/grok-zh"
          cp LICENSE "$package/LICENSE-grok-build.txt"
          cp SOURCE_REV "$package/SOURCE_REV"
          cp THIRD-PARTY-NOTICES "$package/THIRD-PARTY-NOTICES.txt"
          cp crates/codegen/xai-grok-tools/THIRD_PARTY_NOTICES.md \
            "$package/THIRD-PARTY-NOTICES-xai-grok-tools.md"
          cp third_party/NOTICE "$package/NOTICE-third-party.txt"
          cp packaging/linux/INSTALL-LINUX.md "$package/INSTALL-LINUX.md"
          cp packaging/linux/Install-GrokZh.sh "$package/Install-GrokZh.sh"
          chmod 0755 "$package/Install-GrokZh.sh"

          binary_info="$(file "$package/grok-zh")"
          machine_info="$(readelf -h "$package/grok-zh" | sed -n 's/^[[:space:]]*Machine:[[:space:]]*//p')"
          if [[ "$binary_info" != *"ELF 64-bit"* ]] || [[ "$machine_info" != "Advanced Micro Devices X86-64" ]]; then
            echo "::error::产物不是 x86_64 ELF：$binary_info；Machine=$machine_info"
            exit 1
          fi
          version_output="$("$package/grok-zh" --version | head -n 1)"
          if [[ "$version_output" != "grok-zh $GROK_VERSION ("* ]]; then
            echo "::error::grok-zh 版本冒烟失败：$version_output"
            exit 1
          fi
          source_rev="$(tr -d '\r\n' < SOURCE_REV)"
          rustc_info="$(rustc --version)"
          cargo_info="$(cargo --version)"
          dotslash_info="$(dotslash --version | head -n 1)"
          protoc_info="$("$PROTOC" --version | head -n 1)"
          dynamic_info="$(ldd "$package/grok-zh" || true)"
          if [[ "$IS_RELEASE_BUILD" == "true" ]]; then
            build_label="Release 候选"
            update_support="true (immutable GitHub Release contract)"
          else
            build_label="CI 预览版"
            update_support="false (Actions preview artifact only)"
          fi
          {
            echo "Grok Build 简体中文 Linux x86_64 GNU $build_label"
            echo "Product: grok-build-zh"
            echo "License: Apache-2.0"
            echo "Version: $GROK_VERSION"
            echo "Commit: $GITHUB_SHA"
            echo "Upstream source revision: $source_rev"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Target: $TARGET"
            echo "Profile: release-dist (Thin LTO, codegen-units=1, packaged binary strip --strip-debug)"
            echo "Rust: $rustc_info"
            echo "Cargo: $cargo_info"
            echo "DotSlash: $dotslash_info"
            echo "Protoc: $protoc_info"
            echo "ELF: $binary_info"
            echo "Machine: $machine_info"
            echo "Binary version smoke-tested by CI: true"
            echo "Automatic update support: $update_support"
            echo "Dynamic dependencies:"
            printf '%s\n' "$dynamic_info"
          } > "$package/BUILD-INFO.txt"

          manifest_files=(
            grok-zh
            BUILD-INFO.txt
            INSTALL-LINUX.md
            Install-GrokZh.sh
            LICENSE-grok-build.txt
            NOTICE-third-party.txt
            SOURCE_REV
            THIRD-PARTY-NOTICES.txt
            THIRD-PARTY-NOTICES-xai-grok-tools.md
          )
          : > "$package/SHA256SUMS.txt"
          for name in "${manifest_files[@]}"; do
            (
              cd "$package"
              sha256sum "$name"
            ) >> "$package/SHA256SUMS.txt"
          done
          chmod 0644 \
            "$package/BUILD-INFO.txt" \
            "$package/INSTALL-LINUX.md" \
            "$package/LICENSE-grok-build.txt" \
            "$package/NOTICE-third-party.txt" \
            "$package/SHA256SUMS.txt" \
            "$package/SOURCE_REV" \
            "$package/THIRD-PARTY-NOTICES.txt" \
            "$package/THIRD-PARTY-NOTICES-xai-grok-tools.md"
          (
            cd "$package"
            sha256sum -c SHA256SUMS.txt
          )

          # 与已部署社区更新器保持同一解包安全契约。这里在上传前失败，避免再次
          # 发布出能够下载、却会被旧客户端拒绝的压缩包。
          max_entry_bytes=$((512 * 1024 * 1024))
          max_uncompressed_bytes=$((768 * 1024 * 1024))
          max_asset_bytes=$((512 * 1024 * 1024))
          max_sidecar_bytes=$((4 * 1024))
          assert_updater_size_contract() {
            local root="$1"
            local total_bytes=0
            local entry_bytes
            local path
            while IFS= read -r -d '' path; do
              entry_bytes="$(stat -c '%s' "$path")"
              if (( entry_bytes > max_entry_bytes )); then
                echo "::error::Linux 软件包文件超过社区更新器单文件上限（${entry_bytes} > ${max_entry_bytes}）：$path"
                exit 1
              fi
              total_bytes=$((total_bytes + entry_bytes))
            done < <(find "$root" -mindepth 1 -maxdepth 1 -type f -print0)
            if (( total_bytes > max_uncompressed_bytes )); then
              echo "::error::Linux 软件包总文件大小超过社区更新器解包上限（${total_bytes} > ${max_uncompressed_bytes}）：$root"
              exit 1
            fi
            echo "Linux 社区更新器体积契约通过：总文件 ${total_bytes} bytes。"
          }
          assert_updater_size_contract "$package"

          archive="$dist/$ARCHIVE_NAME"
          tar --format=ustar -C "$dist" -czf "$archive" "$PACKAGE_NAME"
          (
            cd "$dist"
            sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
            sha256sum -c "$ARCHIVE_NAME.sha256"
          )
          archive_bytes="$(stat -c '%s' "$archive")"
          sidecar_bytes="$(stat -c '%s' "$archive.sha256")"
          if (( archive_bytes > max_asset_bytes )); then
            echo "::error::Linux 压缩资产超过社区更新器下载上限（${archive_bytes} > ${max_asset_bytes}）：$archive"
            exit 1
          fi
          if (( sidecar_bytes > max_sidecar_bytes )); then
            echo "::error::Linux 校验侧车超过社区更新器上限（${sidecar_bytes} > ${max_sidecar_bytes}）：$archive.sha256"
            exit 1
          fi
          tar -tzf "$archive"
          verify_root="$RUNNER_TEMP/grok-zh-linux-verify-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if [[ -e "$verify_root" ]]; then
            echo "::error::验证目录已经存在：$verify_root"
            exit 1
          fi
          mkdir -p "$verify_root"
          tar -xpzf "$archive" -C "$verify_root"
          package_root="$verify_root/$PACKAGE_NAME"
          expected_top_level="$RUNNER_TEMP/linux-package-root-expected.txt"
          actual_top_level="$RUNNER_TEMP/linux-package-root-actual.txt"
          printf '%s\n' "$PACKAGE_NAME" > "$expected_top_level"
          find "$verify_root" -mindepth 1 -maxdepth 1 -printf '%f\n' |
            LC_ALL=C sort > "$actual_top_level"
          diff -u "$expected_top_level" "$actual_top_level"
          if [[ ! -d "$package_root" || -L "$package_root" ]] ||
             find "$verify_root" -mindepth 1 -maxdepth 1 ! -type d -print -quit | grep -q .; then
            echo "::error::Linux 软件包必须只含同名顶层目录：$PACKAGE_NAME"
            exit 1
          fi
          if [[ "$(stat -c '%a' "$package_root")" != "755" ]]; then
            echo "::error::Linux 软件包顶层目录权限不是 0755。"
            exit 1
          fi
          (
            cd "$package_root"
            sha256sum -c SHA256SUMS.txt
          )
          expected_names="$RUNNER_TEMP/linux-package-expected.txt"
          actual_names="$RUNNER_TEMP/linux-package-actual.txt"
          printf '%s\n' \
            BUILD-INFO.txt \
            INSTALL-LINUX.md \
            Install-GrokZh.sh \
            LICENSE-grok-build.txt \
            NOTICE-third-party.txt \
            SHA256SUMS.txt \
            SOURCE_REV \
            THIRD-PARTY-NOTICES-xai-grok-tools.md \
            THIRD-PARTY-NOTICES.txt \
            grok-zh | LC_ALL=C sort > "$expected_names"
          find "$package_root" -mindepth 1 -maxdepth 1 -printf '%f\n' |
            LC_ALL=C sort > "$actual_names"
          diff -u "$expected_names" "$actual_names"
          if find "$package_root" -mindepth 1 -maxdepth 1 ! -type f -print -quit | grep -q .; then
            echo "::error::Linux 软件包根目录含有非普通文件。"
            exit 1
          fi
          assert_updater_size_contract "$package_root"
          for name in grok-zh Install-GrokZh.sh; do
            [[ "$(stat -c '%a' "$package_root/$name")" == "755" ]] || {
              echo "::error::$name 权限不是 0755。"
              exit 1
            }
          done
          while IFS= read -r name; do
            case "$name" in grok-zh|Install-GrokZh.sh) continue ;; esac
            [[ "$(stat -c '%a' "$package_root/$name")" == "644" ]] || {
              echo "::error::$name 权限不是 0644。"
              exit 1
            }
          done < "$actual_names"
          verify_version_output="$("$package_root/grok-zh" --version | head -n 1)"
          if [[ "$verify_version_output" != "grok-zh $GROK_VERSION ("* ]]; then
            echo "::error::解包后的 grok-zh 版本冒烟失败：$verify_version_output"
            exit 1
          fi
          install_home="$RUNNER_TEMP/grok-zh-linux-install-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 0700 "$install_home"
          GROK_HOME="$install_home/.grok" \
            "$package_root/Install-GrokZh.sh" --with-compat-aliases
          GROK_HOME="$install_home/.grok" \
            "$package_root/Install-GrokZh.sh"
          for command in grok-zh grok; do
            test -L "$install_home/.grok/bin/$command"
            installed_version="$("$install_home/.grok/bin/$command" --version | head -n 1)"
            [[ "$installed_version" == "grok-zh $GROK_VERSION ("* ]] || {
              echo "::error::安装入口 $command 的版本冒烟失败：$installed_version"
              exit 1
            }
          done
          for command in agent-zh agent; do
            test -L "$install_home/.grok/bin/$command"
            agent_help="$("$install_home/.grok/bin/$command" --help)"
            [[ "$agent_help" == *" agent "* ]] || {
              echo "::error::Agent 安装入口 $command 的帮助信息冒烟失败。"
              exit 1
            }
          done
          [[ "$(readlink "$install_home/.grok/bin/agent-zh")" == "grok-zh" ]]
          [[ "$(readlink "$install_home/.grok/bin/grok")" == "grok-zh" ]]
          [[ "$(readlink "$install_home/.grok/bin/agent")" == "agent-zh" ]]
          grep -Fx \
            '{"product":"grok-build-zh","commands":["grok-zh","agent-zh","grok","agent"]}' \
            "$install_home/.grok/bin/.grok-zh-install.json"
          exec 9<>"$install_home/.grok/bin/.grok-zh-install.lock"
          flock -n 9
          if GROK_HOME="$install_home/.grok" "$package_root/Install-GrokZh.sh"; then
            echo "::error::安装器未拒绝已被占用的共享安装锁。"
            exit 1
          fi
          flock -u 9
          exec 9>&-

          coexist_home="$RUNNER_TEMP/grok-zh-linux-coexist-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -m 0700 "$coexist_home" "$coexist_home/.grok" "$coexist_home/.grok/bin"
          printf '%s\n' official-grok > "$coexist_home/.grok/bin/grok"
          printf '%s\n' official-agent > "$coexist_home/.grok/bin/agent"
          GROK_HOME="$coexist_home/.grok" "$package_root/Install-GrokZh.sh"
          grep -Fx official-grok "$coexist_home/.grok/bin/grok"
          grep -Fx official-agent "$coexist_home/.grok/bin/agent"
          grep -Fx \
            '{"product":"grok-build-zh","commands":["grok-zh","agent-zh"]}' \
            "$coexist_home/.grok/bin/.grok-zh-install.json"
          ls -lh "$archive" "$archive.sha256"

      - name: 上传 Linux x86_64 GNU 构建
        id: preview_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package_meta.outputs.artifact_name }}
          path: |
            dist/${{ steps.package_meta.outputs.archive_name }}
            dist/${{ steps.package_meta.outputs.archive_name }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: 在摘要中发布制品详情
        shell: bash
        run: |
          {
            if [[ "${{ inputs.release_build }}" == "true" ]]; then
              echo "## Linux x86_64 GNU Release 候选"
            else
              echo "## Linux x86_64 GNU 预览版"
            fi
            echo
            echo "- 版本：$GROK_VERSION"
            echo "- 制品：$PACKAGE_NAME"
            echo "- Actions Artifact：${{ steps.preview_artifact.outputs.artifact-url }}"
            echo "- Actions Artifact SHA-256：${{ steps.preview_artifact.outputs.artifact-digest }}"
            echo "- 目标：$TARGET"
            echo "- 软件包外层校验：$ARCHIVE_NAME.sha256"
            echo "- 软件包内层校验：SHA256SUMS.txt"
            echo "- 已验证 ELF 架构、精确包结构、包内外校验和、共享安装锁、安装器幂等性、四个兼容入口及与官方入口共存。"
            if [[ "${{ inputs.release_build }}" == "true" ]]; then
              echo "- 此制品交给 Release 工作流完成 attestation、精确资产核验与发布。"
            else
              echo "- Actions 预览制品本身不是自动更新目标；正式不可变 Release 才会被更新器接受。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 保存 Cargo Linux release-dist 缓存
        if: ${{ success() && inputs.release_build != 'true' && github.ref == 'refs/heads/zh-dev' && steps.cargo_target_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grok-zh-target/${{ env.TARGET }}/release-dist
          key: ${{ steps.cargo_target_cache.outputs.cache-primary-key }}

      - name: 保存 Cargo 依赖与工具缓存
        if: ${{ success() && inputs.release_build != 'true' && github.ref == 'refs/heads/zh-dev' && steps.cargo_home_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
