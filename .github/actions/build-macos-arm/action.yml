name: Build macOS ARM
description: 在 GitHub 托管的 Apple Silicon runner 上构建并验证未签名的 macOS ARM64 制品
inputs:
  version:
    description: 正式 Release 使用的严格 SemVer；预览构建留空即可
    required: false
    default: ''
  release_build:
    description: 标记这是统一 Release 工作流调用的正式构建
    required: true
outputs:
  package_name:
    value: ${{ steps.preview.outputs.package_name }}
  archive_name:
    value: ${{ steps.preview.outputs.archive_name }}
  artifact_name:
    value: ${{ steps.preview.outputs.artifact_name }}
runs:
  using: composite
  steps:

      - name: 选择构建版本
        id: preview
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          IS_RELEASE_BUILD: ${{ inputs.release_build }}
        shell: bash
        run: |
          set -euo pipefail
          requested="${REQUESTED_VERSION:-}"
          if [[ "${IS_RELEASE_BUILD}" == "true" && -z "${requested//[[:space:]]/}" ]]; then
            echo "::error::正式构建必须显式提供严格 SemVer 版本。"
            exit 1
          fi
          if [[ -z "${requested//[[:space:]]/}" ]]; then
            package_version="$({
              sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' \
                crates/codegen/xai-grok-pager-bin/Cargo.toml
            } | head -n 1)"
            if [[ -z "${package_version}" ]]; then
              echo "::error::无法读取 pager-bin 软件包版本。"
              exit 1
            fi
            version="${package_version}-zh.ci.${GITHUB_RUN_NUMBER}"
          else
            version="${requested#"${requested%%[![:space:]]*}"}"
            version="${version%"${version##*[![:space:]]}"}"
          fi
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if (( ${#version} > 64 )) || [[ ! "${version}" =~ ${semver_pattern} ]]; then
            echo "::error::版本无效：${version}"
            exit 1
          fi
          package_name="grok-zh-${version}-macos-aarch64"
          archive_name="${package_name}.tar.gz"
          {
            echo "GROK_VERSION=${version}"
            echo "PACKAGE_NAME=${package_name}"
            echo "ARCHIVE_NAME=${archive_name}"
          } >> "${GITHUB_ENV}"
          {
            echo "package_name=${package_name}"
            echo "archive_name=${archive_name}"
            echo "artifact_name=${package_name}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_OUTPUT}"

      - name: 确认 Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "uname -m = ${arch}"
          if [[ "${arch}" != "arm64" ]]; then
            echo "::error::期望 Apple Silicon runner（arm64），实际为 ${arch}。"
            exit 1
          fi

      - name: 配置固定版本的 Rust、DotSlash 和 protoc
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" \
            --profile minimal --component rustfmt
          rustup target add --toolchain "${RUSTUP_TOOLCHAIN}" "${TARGET}"

          cargo_home="${RUNNER_TEMP}/grok-zh-cargo"
          target_dir="${RUNNER_TEMP}/grok-zh-target"
          dotslash_cache="${RUNNER_TEMP}/grok-zh-dotslash"
          tools_dir="${RUNNER_TEMP}/grok-zh-tools"
          mkdir -p "${cargo_home}" "${target_dir}" "${dotslash_cache}" "${tools_dir}"

          dotslash_version="0.5.9"
          dotslash_archive="${RUNNER_TEMP}/dotslash-macos-arm64.tar.gz"
          dotslash_uri="https://github.com/facebook/dotslash/releases/download/v${dotslash_version}/dotslash-macos-arm64.v${dotslash_version}.tar.gz"
          dotslash_sha256="eef15be1b554de7b1409cb0c69c24f2cd04f19c0f101ad69fcdf9d66d4d51639"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "${dotslash_archive}" "${dotslash_uri}"
          printf '%s  %s\n' "${dotslash_sha256}" "${dotslash_archive}" |
            shasum -a 256 -c -
          tar -xzf "${dotslash_archive}" -C "${tools_dir}"
          chmod 0755 "${tools_dir}/dotslash"

          echo "${tools_dir}" >> "${GITHUB_PATH}"
          {
            echo "CARGO_HOME=${cargo_home}"
            echo "CARGO_TARGET_DIR=${target_dir}"
            echo "DOTSLASH_CACHE=${dotslash_cache}"
            echo "PROTOC=${GITHUB_WORKSPACE}/bin/protoc"
          } >> "${GITHUB_ENV}"

          export PATH="${tools_dir}:${PATH}"
          export DOTSLASH_CACHE="${dotslash_cache}"
          export PROTOC="${GITHUB_WORKSPACE}/bin/protoc"
          rustc --version --verbose
          cargo --version --verbose
          dotslash --version

      - name: 恢复 Cargo 依赖缓存
        id: cargo_home_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/grok-zh-cargo/registry
            ${{ runner.temp }}/grok-zh-cargo/git
            ${{ runner.temp }}/grok-zh-dotslash
          key: grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-
            grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-

      - name: 恢复 Cargo macOS release-dist 缓存
        id: cargo_target_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grok-zh-target/${{ env.TARGET }}/release-dist
          key: grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-
            grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-

      - name: 恢复 Cargo macOS 宿主构建缓存
        id: cargo_host_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grok-zh-target/release-dist
          key: grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-
            grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-

      - name: 验证格式与基础本地化
        shell: bash
        run: |
          set -euo pipefail
          # protoc 会写入 DOTSLASH_CACHE，必须在缓存恢复完成后再调用。
          "${PROTOC}" --version
          cargo fmt --all -- --check
          cargo fetch --locked --target "${TARGET}"
          cargo test --frozen -j "${CARGO_BUILD_JOBS}" -p xai-grok-locale
          cargo test --frozen -j "${CARGO_BUILD_JOBS}" \
            -p xai-grok-update --features community-build --lib

      - name: 构建 macOS ARM64
        shell: bash
        run: |
          set -euo pipefail
          cargo build --frozen -j "${CARGO_BUILD_JOBS}" \
            --target "${TARGET}" \
            -p xai-grok-pager-bin \
            --profile release-dist \
            --features release-dist

      - name: 打包并验证未签名构建
        env:
          IS_RELEASE_BUILD: ${{ inputs.release_build }}
        shell: bash
        run: |
          set -euo pipefail
          dist="${GITHUB_WORKSPACE}/dist"
          package="${dist}/${PACKAGE_NAME}"
          built_bin="${CARGO_TARGET_DIR}/${TARGET}/release-dist/grok-zh"
          mkdir -p "${package}"
          chmod 0755 "${package}"
          if [[ ! -f "${built_bin}" ]]; then
            echo "::error::找不到编译产物：${built_bin}"
            exit 1
          fi
          cp "${built_bin}" "${package}/grok-zh"
          chmod 0755 "${package}/grok-zh"
          cp LICENSE "${package}/LICENSE-grok-build.txt"
          cp SOURCE_REV "${package}/SOURCE_REV"
          cp THIRD-PARTY-NOTICES "${package}/THIRD-PARTY-NOTICES.txt"
          cp crates/codegen/xai-grok-tools/THIRD_PARTY_NOTICES.md \
            "${package}/THIRD-PARTY-NOTICES-xai-grok-tools.md"
          cp third_party/NOTICE "${package}/NOTICE-third-party.txt"
          cp packaging/macos/INSTALL-MACOS.md "${package}/INSTALL-MACOS.md"
          cp packaging/macos/Install-GrokZh.sh "${package}/Install-GrokZh.sh"
          chmod 0755 "${package}/Install-GrokZh.sh"

          binary_info="$(file "${package}/grok-zh")"
          binary_archs="$(lipo -archs "${package}/grok-zh")"
          if [[ "${binary_archs}" != "arm64" ]] || [[ "${binary_info}" != *arm64* ]]; then
            echo "::error::产物不是纯 ARM64 Mach-O：${binary_info}; archs=${binary_archs}"
            exit 1
          fi
          version_output="$("${package}/grok-zh" --version | head -n 1)"
          if [[ "${version_output}" != "grok-zh ${GROK_VERSION} ("* ]]; then
            echo "::error::grok-zh 版本冒烟失败：${version_output}"
            exit 1
          fi
          source_rev="$(tr -d '\r\n' < SOURCE_REV)"
          rustc_info="$(rustc --version)"
          cargo_info="$(cargo --version)"
          dotslash_info="$(dotslash --version | head -n 1)"
          protoc_info="$("${PROTOC}" --version | head -n 1)"
          if [[ "${IS_RELEASE_BUILD}" == "true" ]]; then
            build_label="GitHub Release"
          else
            build_label="CI 预览版"
          fi
          cat > "${package}/BUILD-INFO.txt" <<EOF
          Grok Build 简体中文 macOS ARM64 ${build_label}
          Product: grok-build-zh
          License: Apache-2.0
          Version: ${GROK_VERSION}
          Commit: ${GITHUB_SHA}
          Upstream source revision: ${source_rev}
          Repository: ${GITHUB_REPOSITORY}
          Target: ${TARGET}
          Profile: release-dist (Thin LTO, codegen-units=1, split-debuginfo=off)
          Rust: ${rustc_info}
          Cargo: ${cargo_info}
          DotSlash: ${dotslash_info}
          Protoc: ${protoc_info}
          Mach-O: ${binary_info}
          Architectures: ${binary_archs}
          Code signing: unsigned
          Apple notarization: not submitted
          Binary version smoke-tested by CI: true
          Installer and managed links smoke-tested by CI: true
          Default commands after installation: grok-zh, agent-zh
          EOF
          sed -i '' 's/^          //' "${package}/BUILD-INFO.txt"

          manifest_files=(
            grok-zh
            BUILD-INFO.txt
            INSTALL-MACOS.md
            Install-GrokZh.sh
            LICENSE-grok-build.txt
            NOTICE-third-party.txt
            SOURCE_REV
            THIRD-PARTY-NOTICES.txt
            THIRD-PARTY-NOTICES-xai-grok-tools.md
          )
          : > "${package}/SHA256SUMS.txt"
          for name in "${manifest_files[@]}"; do
            (
              cd "${package}"
              shasum -a 256 "${name}"
            ) >> "${package}/SHA256SUMS.txt"
          done
          chmod 0644 \
            "${package}/BUILD-INFO.txt" \
            "${package}/INSTALL-MACOS.md" \
            "${package}/LICENSE-grok-build.txt" \
            "${package}/NOTICE-third-party.txt" \
            "${package}/SHA256SUMS.txt" \
            "${package}/SOURCE_REV" \
            "${package}/THIRD-PARTY-NOTICES.txt" \
            "${package}/THIRD-PARTY-NOTICES-xai-grok-tools.md"
          (
            cd "${package}"
            shasum -a 256 -c SHA256SUMS.txt
          )

          archive="${dist}/${ARCHIVE_NAME}"
          COPYFILE_DISABLE=1 tar --format=ustar -C "${dist}" -czf "${archive}" "${PACKAGE_NAME}"
          (
            cd "${dist}"
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
            shasum -a 256 -c "${ARCHIVE_NAME}.sha256"
          )
          tar -tzf "${archive}"
          verify_root="${RUNNER_TEMP}/grok-zh-macos-verify-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "${verify_root}" ]]; then
            echo "::error::验证目录已经存在：${verify_root}"
            exit 1
          fi
          mkdir -p "${verify_root}"
          COPYFILE_DISABLE=1 tar -xzf "${archive}" -C "${verify_root}"
          package_root="${verify_root}/${PACKAGE_NAME}"
          shopt -s nullglob dotglob
          top_level_entries=("${verify_root}"/*)
          shopt -u nullglob dotglob
          only_top_level="${top_level_entries[0]:-}"
          if (( ${#top_level_entries[@]} != 1 )) || \
             [[ "${only_top_level}" != "${package_root}" ]] || \
             [[ ! -d "${package_root}" || -L "${package_root}" ]]; then
            echo "::error::macOS 软件包必须只含同名顶层目录：${PACKAGE_NAME}"
            exit 1
          fi
          if [[ "$(stat -f '%Lp' "${package_root}")" != "755" ]]; then
            echo "::error::macOS 软件包顶层目录权限不是 0755。"
            exit 1
          fi
          expected_names="${verify_root}/expected-names.txt"
          actual_names="${verify_root}/actual-names.txt"
          printf '%s\n' \
            BUILD-INFO.txt \
            INSTALL-MACOS.md \
            Install-GrokZh.sh \
            LICENSE-grok-build.txt \
            NOTICE-third-party.txt \
            SHA256SUMS.txt \
            SOURCE_REV \
            THIRD-PARTY-NOTICES-xai-grok-tools.md \
            THIRD-PARTY-NOTICES.txt \
            grok-zh | LC_ALL=C sort > "${expected_names}"
          shopt -s nullglob dotglob
          package_entries=("${package_root}"/*)
          shopt -u nullglob dotglob
          printf '%s\n' "${package_entries[@]##*/}" | LC_ALL=C sort > "${actual_names}"
          diff -u "${expected_names}" "${actual_names}"
          for entry in "${package_entries[@]}"; do
            if [[ ! -f "${entry}" || -L "${entry}" ]]; then
              echo "::error::macOS 软件包根目录含有非普通文件：${entry}"
              exit 1
            fi
          done
          for name in grok-zh Install-GrokZh.sh; do
            if [[ "$(stat -f '%Lp' "${package_root}/${name}")" != "755" ]]; then
              echo "::error::${name} 权限不是 0755。"
              exit 1
            fi
          done
          for name in "${package_entries[@]##*/}"; do
            case "${name}" in grok-zh|Install-GrokZh.sh) continue ;; esac
            if [[ "$(stat -f '%Lp' "${package_root}/${name}")" != "644" ]]; then
              echo "::error::${name} 权限不是 0644。"
              exit 1
            fi
          done
          (
            cd "${package_root}"
            shasum -a 256 -c SHA256SUMS.txt
          )
          verify_version_output="$("${package_root}/grok-zh" --version | head -n 1)"
          if [[ "${verify_version_output}" != "grok-zh ${GROK_VERSION} ("* ]]; then
            echo "::error::解包后的 grok-zh 版本冒烟失败：${verify_version_output}"
            exit 1
          fi

          install_home="${RUNNER_TEMP}/grok-zh-install-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "${install_home}" ]]; then
            echo "::error::安装器验证目录已经存在：${install_home}"
            exit 1
          fi
          GROK_HOME="${install_home}" "${package_root}/Install-GrokZh.sh"
          bin_dir="${install_home}/bin"
          first_target="$(readlink "${bin_dir}/grok-zh")"
          [[ "${first_target}" == ../grok-zh-downloads/grok-zh-*-macos-aarch64.*.installed ]]
          [[ "$(readlink "${bin_dir}/agent-zh")" == "grok-zh" ]]
          [[ ! -e "${bin_dir}/grok" && ! -L "${bin_dir}/grok" ]]
          [[ ! -e "${bin_dir}/agent" && ! -L "${bin_dir}/agent" ]]
          installed_version="$("${bin_dir}/grok-zh" --version | head -n 1)"
          [[ "${installed_version}" == "grok-zh ${GROK_VERSION} ("* ]]

          GROK_HOME="${install_home}" "${package_root}/Install-GrokZh.sh" --with-compat-aliases
          second_target="$(readlink "${bin_dir}/grok-zh")"
          [[ "${second_target}" == ../grok-zh-downloads/grok-zh-*-macos-aarch64.*.installed ]]
          [[ "${second_target}" != "${first_target}" ]]
          [[ -f "${bin_dir}/${first_target}" ]]
          [[ -f "${bin_dir}/${second_target}" ]]
          alias_version="$("${bin_dir}/grok" --version | head -n 1)"
          [[ "${alias_version}" == "grok-zh ${GROK_VERSION} ("* ]]
          ls -lh "${archive}" "${archive}.sha256"

      - name: 上传 macOS ARM64 构建
        id: preview_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.preview.outputs.artifact_name }}
          path: |
            dist/${{ steps.preview.outputs.archive_name }}
            dist/${{ steps.preview.outputs.archive_name }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: 在摘要中发布制品详情
        env:
          IS_RELEASE_BUILD: ${{ inputs.release_build }}
        shell: bash
        run: |
          if [[ "${IS_RELEASE_BUILD}" == "true" ]]; then
            summary_title="macOS ARM64 Release 构建"
            usage_note="未经过 Apple Developer ID 签名或公证；发布时由统一 Release 工作流校验并设为不可变。"
          else
            summary_title="macOS ARM64 预览版"
            usage_note="未经过 Apple Developer ID 签名或公证，仅用于预览测试。"
          fi
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## ${summary_title}

          - 版本：\`${GROK_VERSION}\`
          - 制品：[${PACKAGE_NAME}](${{ steps.preview_artifact.outputs.artifact-url }})
          - Actions Artifact SHA-256：\`${{ steps.preview_artifact.outputs.artifact-digest }}\`
          - 目标：\`${TARGET}\`
          - 软件包外层校验：\`${ARCHIVE_NAME}.sha256\`
          - 软件包内层校验：\`SHA256SUMS.txt\`
          - 已在 Apple Silicon runner 上执行二次安装、入口链接与 \`grok-zh --version\` 验证。
          - ${usage_note}
          EOF

      - name: 保存 Cargo macOS release 缓存
        if: ${{ success() && inputs.release_build != 'true' && github.ref == 'refs/heads/zh-dev' && steps.cargo_target_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grok-zh-target/${{ env.TARGET }}/release-dist
          key: ${{ steps.cargo_target_cache.outputs.cache-primary-key }}

      - name: 保存 Cargo macOS 宿主构建缓存
        if: ${{ success() && inputs.release_build != 'true' && github.ref == 'refs/heads/zh-dev' && steps.cargo_host_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grok-zh-target/release-dist
          key: ${{ steps.cargo_host_cache.outputs.cache-primary-key }}

      - name: 保存 Cargo 依赖缓存
        if: ${{ success() && inputs.release_build != 'true' && github.ref == 'refs/heads/zh-dev' && steps.cargo_home_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/grok-zh-cargo/registry
            ${{ runner.temp }}/grok-zh-cargo/git
            ${{ runner.temp }}/grok-zh-dotslash
          key: ${{ steps.cargo_home_cache.outputs.cache-primary-key }}
