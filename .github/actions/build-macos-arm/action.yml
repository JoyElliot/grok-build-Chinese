name: Build macOS
description: 在 GitHub 托管的 macOS runner 上构建并验证未签名制品
inputs:
  version:
    description: 正式 Release 使用的严格 SemVer；预览构建留空即可
    required: false
    default: ''
  release_build:
    description: 标记这是统一 Release 工作流调用的正式构建
    required: true
  phase:
    description: all 执行完整流程；test/build 供预览工作流并行运行并统一门禁
    required: false
    default: all
  build_variant:
    description: CI 对照配置；正式 Release 只接受 current
    required: false
    default: current
  cross_compile:
    description: 仅预览 build 阶段允许在 ARM64 宿主交叉编译 x86_64；需独立 Intel 原生验证
    required: false
    default: 'false'
outputs:
  version:
    value: ${{ steps.preview.outputs.version }}
  package_name:
    value: ${{ steps.preview.outputs.package_name }}
  archive_name:
    value: ${{ steps.preview.outputs.archive_name }}
  artifact_name:
    value: ${{ steps.preview.outputs.artifact_name }}
runs:
  using: composite
  steps:

      - name: 选择构建版本
        id: preview
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          IS_RELEASE_BUILD: ${{ inputs.release_build }}
          BUILD_PHASE: ${{ inputs.phase }}
        shell: bash
        run: |
          set -euo pipefail
          case "$BUILD_PHASE" in all|test|build) ;; *) echo '::error::无效的构建阶段。'; exit 1 ;; esac
          if [[ "$IS_RELEASE_BUILD" == true && "$BUILD_PHASE" != all ]]; then
            echo '::error::正式 Release 必须执行完整测试与构建。'
            exit 1
          fi
          requested="${REQUESTED_VERSION:-}"
          if [[ "${IS_RELEASE_BUILD}" == "true" && -z "${requested//[[:space:]]/}" ]]; then
            echo "::error::正式构建必须显式提供严格 SemVer 版本。"
            exit 1
          fi
          if [[ -z "${requested//[[:space:]]/}" ]]; then
            package_version="$({
              sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"[[:space:]]*$/\1/p' \
                crates/codegen/xai-grok-pager-bin/Cargo.toml
            } | head -n 1)"
            if [[ -z "${package_version}" ]]; then
              echo "::error::无法读取 pager-bin 软件包版本。"
              exit 1
            fi
            version="${package_version}-zh.ci.${GITHUB_RUN_NUMBER}"
          else
            version="${requested#"${requested%%[![:space:]]*}"}"
            version="${version%"${version##*[![:space:]]}"}"
          fi
          semver_pattern='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
          if (( ${#version} > 64 )) || [[ ! "${version}" =~ ${semver_pattern} ]]; then
            echo "::error::版本无效：${version}"
            exit 1
          fi
          case "${TARGET}" in
            aarch64-apple-darwin) macos_arch=aarch64; binary_arch=arm64 ;;
            x86_64-apple-darwin) macos_arch=x86_64; binary_arch=x86_64 ;;
            *) echo "::error::不支持的 macOS target：${TARGET}"; exit 1 ;;
          esac
          package_name="grok-zh-${version}-macos-${macos_arch}"
          archive_name="${package_name}.tar.gz"
          {
            echo "GROK_VERSION=${version}"
            echo "PACKAGE_NAME=${package_name}"
            echo "ARCHIVE_NAME=${archive_name}"
            echo "MACOS_ARCH=${macos_arch}"
            echo "MACOS_BINARY_ARCH=${binary_arch}"
          } >> "${GITHUB_ENV}"
          {
            echo "version=${version}"
            echo "package_name=${package_name}"
            echo "archive_name=${archive_name}"
            echo "artifact_name=${package_name}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "${GITHUB_OUTPUT}"

      - name: 验证 macOS 宿主与目标执行环境
        env:
          ALLOW_CROSS: ${{ inputs.cross_compile }}
          IS_RELEASE_BUILD: ${{ inputs.release_build }}
          BUILD_PHASE: ${{ inputs.phase }}
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          echo "uname -m = ${arch}"
          if [[ "${ALLOW_CROSS}" == true ]]; then
            if [[ "${IS_RELEASE_BUILD}" == true || "${BUILD_PHASE}" != build \
              || "${arch}" != arm64 || "${TARGET}" != x86_64-apple-darwin \
              || "${RUSTUP_TOOLCHAIN}" != *-aarch64-apple-darwin ]]; then
              echo '::error::交叉编译仅允许 ARM64 宿主上的 Intel 预览 build 阶段。'
              exit 1
            fi
            /usr/bin/arch -x86_64 /bin/sh -c 'test "$(/usr/bin/uname -m)" = x86_64'
            xcrun --sdk macosx --show-sdk-path
            {
              echo 'MACOS_VERIFY_MODE=rosetta'
              echo 'MACOS_EXECUTION_DESCRIPTION=x86_64 via Rosetta on arm64; native Intel validation is a separate required job'
              echo 'BINDGEN_EXTRA_CLANG_ARGS_x86_64_apple_darwin=--target=x86_64-apple-darwin'
            } >> "${GITHUB_ENV}"
          elif [[ "${ALLOW_CROSS}" == false && "${arch}" == "${MACOS_BINARY_ARCH}" ]]; then
            {
              echo 'MACOS_VERIFY_MODE=native'
              echo "MACOS_EXECUTION_DESCRIPTION=native ${arch}"
            } >> "${GITHUB_ENV}"
          else
            echo "::error::非预期宿主与目标组合：${arch} / ${TARGET}。"
            exit 1
          fi
          echo "MACOS_HOST_ARCH=${arch}" >> "${GITHUB_ENV}"

      - name: 选择 macOS 编译配置
        env:
          IS_RELEASE_BUILD: ${{ inputs.release_build }}
          MACOS_BUILD_VARIANT: ${{ inputs.build_variant }}
          MACOS_TRUSTED_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/macos-build.py configure \
            --release-build "${IS_RELEASE_BUILD}" >> "${GITHUB_ENV}"

      - name: 配置固定版本的 Rust、DotSlash 和 protoc
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "${RUSTUP_TOOLCHAIN}" \
            --profile minimal --component rustfmt
          rustup target add --toolchain "${RUSTUP_TOOLCHAIN}" "${TARGET}"

          cargo_home="${RUNNER_TEMP}/grok-zh-cargo"
          target_dir="${RUNNER_TEMP}/grok-zh-target"
          dotslash_cache="${RUNNER_TEMP}/grok-zh-dotslash"
          tools_dir="${RUNNER_TEMP}/grok-zh-tools"
          mkdir -p "${cargo_home}" "${target_dir}" "${dotslash_cache}" "${tools_dir}"

          dotslash_version="0.5.9"
          if [[ "${MACOS_HOST_ARCH}" == "arm64" ]]; then
            dotslash_platform=macos-arm64
            dotslash_sha256="eef15be1b554de7b1409cb0c69c24f2cd04f19c0f101ad69fcdf9d66d4d51639"
          else
            dotslash_platform=macos-amd64
            dotslash_sha256="51446593596ffe4cd22bc43a0fe6d82dd367758eb53cb4ade36d6a684ed08469"
          fi
          dotslash_archive="${RUNNER_TEMP}/dotslash-${dotslash_platform}.tar.gz"
          dotslash_uri="https://github.com/facebook/dotslash/releases/download/v${dotslash_version}/dotslash-${dotslash_platform}.v${dotslash_version}.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors \
            --output "${dotslash_archive}" "${dotslash_uri}"
          printf '%s  %s\n' "${dotslash_sha256}" "${dotslash_archive}" |
            shasum -a 256 -c -
          tar -xzf "${dotslash_archive}" -C "${tools_dir}"
          chmod 0755 "${tools_dir}/dotslash"

          echo "${tools_dir}" >> "${GITHUB_PATH}"
          {
            echo "CARGO_HOME=${cargo_home}"
            echo "CARGO_TARGET_DIR=${target_dir}"
            echo "DOTSLASH_CACHE=${dotslash_cache}"
            echo "PROTOC=${GITHUB_WORKSPACE}/bin/protoc"
          } >> "${GITHUB_ENV}"

          export PATH="${tools_dir}:${PATH}"
          export DOTSLASH_CACHE="${dotslash_cache}"
          export PROTOC="${GITHUB_WORKSPACE}/bin/protoc"
          rustc --version --verbose
          cargo --version --verbose
          dotslash --version

      - name: 恢复 Cargo 依赖缓存
        id: cargo_home_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/grok-zh-cargo/registry
            ${{ runner.temp }}/grok-zh-cargo/git
            ${{ runner.temp }}/grok-zh-dotslash
          key: grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-
            grok-zh-cargo-home-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-

      - name: 恢复 Cargo macOS 编译缓存
        if: inputs.phase != 'test'
        id: cargo_target_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grok-zh-target/${{ env.TARGET }}/${{ env.MACOS_CARGO_PROFILE }}
          key: grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ env.MACOS_PROFILE_CACHE_KEY }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ env.MACOS_PROFILE_CACHE_KEY }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-
            grok-zh-target-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ env.MACOS_PROFILE_CACHE_KEY }}-

      - name: 恢复 Cargo macOS 宿主构建缓存
        if: inputs.phase != 'test'
        id: cargo_host_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/grok-zh-target/${{ env.MACOS_CARGO_PROFILE }}
          key: grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ env.MACOS_PROFILE_CACHE_KEY }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ env.MACOS_PROFILE_CACHE_KEY }}-${{ hashFiles('**/Cargo.toml', '**/build.rs', '.cargo/config.toml', 'rust-toolchain.toml', 'bin/protoc') }}-
            grok-zh-host-${{ env.CARGO_CACHE_SCHEMA }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-${{ env.MACOS_PROFILE_CACHE_KEY }}-

      - name: 获取锁定版本的 Cargo 依赖
        shell: bash
        run: |
          set -euo pipefail
          # protoc 会写入 DOTSLASH_CACHE，必须在缓存恢复完成后再调用。
          "${PROTOC}" --version
          cargo fetch --locked --target "${TARGET}"

      - name: 验证格式与基础本地化
        if: inputs.phase != 'build'
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tests/test_macos_build.py
          python3 .github/scripts/tests/test_unix_binary.py
          python3 packaging/macos/tests/test_install_lock.py
          cargo fmt --all -- --check
          cargo test --frozen -j "${CARGO_BUILD_JOBS}" -p xai-grok-locale
          cargo test --frozen -j "${CARGO_BUILD_JOBS}" \
            -p xai-grok-update --features community-build --lib

      - name: 构建并监控 macOS
        if: inputs.phase != 'test'
        env:
          IS_RELEASE_BUILD: ${{ inputs.release_build }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/macos-build.py build \
            --release-build "${IS_RELEASE_BUILD}"

      - name: 打包并验证未签名构建
        if: inputs.phase != 'test'
        env:
          IS_RELEASE_BUILD: ${{ inputs.release_build }}
        shell: bash
        run: |
          set -euo pipefail
          dist="${GITHUB_WORKSPACE}/dist"
          package="${dist}/${PACKAGE_NAME}"
          built_bin="${CARGO_TARGET_DIR}/${TARGET}/${MACOS_CARGO_PROFILE}/grok-zh"
          mkdir -p "${package}"
          chmod 0755 "${package}"
          if [[ ! -f "${built_bin}" ]]; then
            echo "::error::找不到编译产物：${built_bin}"
            exit 1
          fi
          strip_input="${built_bin}"
          if [[ "${TARGET}" == "x86_64-apple-darwin" ]]; then
            # Intel linkers can leave the input unsigned. Preserve an existing
            # signature for the runtime-image checker to inspect and reject if needed.
            load_commands="$(otool -l "${built_bin}")"
            if ! printf '%s\n' "${load_commands}" |
              awk '$1 == "cmd" && $2 == "LC_CODE_SIGNATURE" { found = 1 } END { exit !found }'; then
              strip_input="${RUNNER_TEMP}/grok-zh-macos-signing-input-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
              cp "${built_bin}" "${strip_input}"
              chmod 0755 "${strip_input}"
              codesign --sign - --identifier grok-zh "${strip_input}"
            fi
            codesign --verify --strict "${strip_input}"
          fi
          if [[ "${MACOS_VERIFY_MODE}" == rosetta ]]; then
            set -- --rosetta-startup
          else
            set --
          fi
          python3 .github/scripts/strip-unix-binary.py --platform macos \
            --input "${strip_input}" --output "${package}/grok-zh" \
            --diagnostics "${MACOS_BUILD_REPORT_DIR}/diagnostics" --version "${GROK_VERSION}" \
            "$@"
          cp LICENSE "${package}/LICENSE-grok-build.txt"
          cp SOURCE_REV "${package}/SOURCE_REV"
          cp THIRD-PARTY-NOTICES "${package}/THIRD-PARTY-NOTICES.txt"
          cp crates/codegen/xai-grok-tools/THIRD_PARTY_NOTICES.md \
            "${package}/THIRD-PARTY-NOTICES-xai-grok-tools.md"
          cp third_party/NOTICE "${package}/NOTICE-third-party.txt"
          cp packaging/macos/INSTALL-MACOS.md "${package}/INSTALL-MACOS.md"
          cp packaging/macos/Install-GrokZh.sh "${package}/Install-GrokZh.sh"
          chmod 0755 "${package}/Install-GrokZh.sh"

          binary_info="$(file "${package}/grok-zh")"
          binary_archs="$(lipo -archs "${package}/grok-zh")"
          if [[ "${binary_archs}" != "${MACOS_BINARY_ARCH}" ]] || [[ "${binary_info}" != *"${MACOS_BINARY_ARCH}"* ]]; then
            echo "::error::产物不是纯 ${MACOS_BINARY_ARCH} Mach-O：${binary_info}; archs=${binary_archs}"
            exit 1
          fi
          version_output="$("${package}/grok-zh" --version | head -n 1)"
          if [[ "${version_output}" != "grok-zh ${GROK_VERSION} ("* ]]; then
            echo "::error::grok-zh 版本冒烟失败：${version_output}"
            exit 1
          fi
          source_rev="$(tr -d '\r\n' < SOURCE_REV)"
          rustc_info="$(rustc --version)"
          cargo_info="$(cargo --version)"
          dotslash_info="$(dotslash --version | head -n 1)"
          protoc_info="$("${PROTOC}" --version | head -n 1)"
          if [[ "${IS_RELEASE_BUILD}" == "true" ]]; then
            build_label="GitHub Release"
          else
            build_label="CI 预览版"
          fi
          cat > "${package}/BUILD-INFO.txt" <<EOF
          Grok Build 简体中文 macOS ${MACOS_BINARY_ARCH} ${build_label}
          Product: grok-build-zh
          License: Apache-2.0
          Version: ${GROK_VERSION}
          Commit: ${GITHUB_SHA}
          Upstream source revision: ${source_rev}
          Repository: ${GITHUB_REPOSITORY}
          Target: ${TARGET}
          Build host: ${MACOS_HOST_ARCH}
          CI smoke execution: ${MACOS_EXECUTION_DESCRIPTION}
          Profile: ${MACOS_PROFILE_DESCRIPTION}
          Rust: ${rustc_info}
          Cargo: ${cargo_info}
          DotSlash: ${dotslash_info}
          Protoc: ${protoc_info}
          Mach-O: ${binary_info}
          Architectures: ${binary_archs}
          Code signing: ad-hoc (not Developer ID); verified after local-symbol stripping
          Apple notarization: not submitted
          Binary version smoke-tested by CI: true
          Installer and managed links smoke-tested by CI: true
          Default commands after installation: grok-zh, agent-zh
          EOF
          sed -i '' 's/^          //' "${package}/BUILD-INFO.txt"
          python3 .github/scripts/write-package-protocol.py --package "${package}" --version "${GROK_VERSION}" --platform "${TARGET}"

          manifest_files=(
            grok-zh
            BUILD-INFO.txt
            INSTALL-MACOS.md
            Install-GrokZh.sh
            LICENSE-grok-build.txt
            NOTICE-third-party.txt
            SOURCE_REV
            THIRD-PARTY-NOTICES.txt
            THIRD-PARTY-NOTICES-xai-grok-tools.md
          )
          : > "${package}/SHA256SUMS.txt"
          for name in "${manifest_files[@]}"; do
            (
              cd "${package}"
              shasum -a 256 "${name}"
            ) >> "${package}/SHA256SUMS.txt"
          done
          chmod 0644 \
            "${package}/BUILD-INFO.txt" \
            "${package}/INSTALL-MACOS.md" \
            "${package}/LICENSE-grok-build.txt" \
            "${package}/NOTICE-third-party.txt" \
            "${package}/SHA256SUMS.txt" \
            "${package}/SOURCE_REV" \
            "${package}/THIRD-PARTY-NOTICES.txt" \
            "${package}/THIRD-PARTY-NOTICES-xai-grok-tools.md"
          (
            cd "${package}"
            shasum -a 256 -c SHA256SUMS.txt
          )

          archive="${dist}/${ARCHIVE_NAME}"
          COPYFILE_DISABLE=1 tar --format=ustar -C "${dist}" -czf "${archive}" "${PACKAGE_NAME}"
          (
            cd "${dist}"
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
            shasum -a 256 -c "${ARCHIVE_NAME}.sha256"
          )
          tar -tzf "${archive}"
          bash .github/scripts/verify-macos-package.sh "${archive}"

      - name: 上传 macOS 构建监控与 Cargo timings
        if: ${{ always() && inputs.phase != 'test' && env.MACOS_BUILD_REPORT_DIR != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grok-zh-macos-${{ env.MACOS_ARCH }}-build-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.MACOS_BUILD_REPORT_DIR }}
            ${{ runner.temp }}/grok-zh-target/cargo-timings
          if-no-files-found: warn
          retention-days: 7

      - name: 上传 macOS 构建
        if: inputs.phase != 'test'
        id: preview_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.preview.outputs.artifact_name }}
          path: |
            dist/${{ steps.preview.outputs.archive_name }}
            dist/${{ steps.preview.outputs.archive_name }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: 在摘要中发布制品详情
        if: inputs.phase != 'test'
        env:
          IS_RELEASE_BUILD: ${{ inputs.release_build }}
        shell: bash
        run: |
          if [[ "${IS_RELEASE_BUILD}" == "true" ]]; then
            summary_title="macOS ${MACOS_BINARY_ARCH} Release 构建"
            usage_note="未经过 Apple Developer ID 签名或公证；发布时由统一 Release 工作流校验并设为不可变。"
          else
            summary_title="macOS ${MACOS_BINARY_ARCH} 预览版"
            usage_note="未经过 Apple Developer ID 签名或公证，仅用于预览测试。"
          fi
          cat >> "${GITHUB_STEP_SUMMARY}" <<EOF
          ## ${summary_title}

          - 版本：\`${GROK_VERSION}\`
          - 制品：[${PACKAGE_NAME}](${{ steps.preview_artifact.outputs.artifact-url }})
          - Actions Artifact SHA-256：\`${{ steps.preview_artifact.outputs.artifact-digest }}\`
          - 目标：\`${TARGET}\`
          - 编译配置：\`${MACOS_PROFILE_DESCRIPTION}\`
          - 本轮允许保存 Cargo 缓存：\`${MACOS_CACHE_WRITABLE}\`
          - 软件包外层校验：\`${ARCHIVE_NAME}.sha256\`
          - 软件包内层校验：\`SHA256SUMS.txt\`
          - 二次安装、入口链接与 CLI 验证执行环境：${MACOS_EXECUTION_DESCRIPTION}。
          - ${usage_note}
          EOF

      - name: 保存 Cargo macOS 编译缓存
        if: ${{ success() && inputs.phase != 'test' && env.MACOS_CACHE_WRITABLE == 'true' && steps.cargo_target_cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/save-cargo-cache
        with:
          path: ${{ runner.temp }}/grok-zh-target/${{ env.TARGET }}/${{ env.MACOS_CARGO_PROFILE }}
          key: ${{ steps.cargo_target_cache.outputs.cache-primary-key }}

      - name: 保存 Cargo macOS 宿主构建缓存
        if: ${{ success() && inputs.phase != 'test' && env.MACOS_CACHE_WRITABLE == 'true' && steps.cargo_host_cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/save-cargo-cache
        with:
          path: ${{ runner.temp }}/grok-zh-target/${{ env.MACOS_CARGO_PROFILE }}
          key: ${{ steps.cargo_host_cache.outputs.cache-primary-key }}

      - name: 保存 Cargo 依赖缓存
        if: ${{ success() && inputs.phase != 'test' && env.MACOS_CACHE_WRITABLE == 'true' && steps.cargo_home_cache.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/save-cargo-cache
        with:
          path: |
            ${{ runner.temp }}/grok-zh-cargo/registry
            ${{ runner.temp }}/grok-zh-cargo/git
            ${{ runner.temp }}/grok-zh-dotslash
          key: ${{ steps.cargo_home_cache.outputs.cache-primary-key }}
