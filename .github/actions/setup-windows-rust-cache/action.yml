name: Optional Windows Rust compiler cache
description: Restore bounded content-addressed Rust results without changing release compiler options.
inputs:
  save-cache:
    description: Only trusted preview runs may write the cache; Release is read-only.
    default: 'false'
outputs:
  enabled:
    value: ${{ steps.activate.outputs.enabled }}
    description: Whether the optional compiler cache was activated.
  cache-hit:
    value: ${{ steps.restore.outputs.cache-hit }}
    description: Whether the immutable cache key matched exactly.
  cache-primary-key:
    value: ${{ steps.restore.outputs.cache-primary-key }}
    description: Key used for saving after a successful build.
runs:
  using: composite
  steps:
    - name: 准备可选 Rust 内容缓存
      id: prepare
      shell: pwsh
      env:
        RUST_CACHE_MODE: ${{ inputs.save-cache == 'true' && 'READ_WRITE' || 'READ_ONLY' }}
      run: python .github/scripts/windows-rust-cache.py prepare

    - name: 恢复有容量上限的 Rust 内容缓存
      id: restore
      if: steps.prepare.outputs.prepared == 'true'
      continue-on-error: true
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/grok-rust-content-cache
        # Stable configuration keys, never one full archive per SHA or run.
        key: grok-zh-rust-content-v1-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-${{ hashFiles('.github/scripts/windows-rust-cache.py', '.github/scripts/rust-cache-wrapper.rs', '.github/actions/setup-windows-rust-cache/action.yml', 'Cargo.lock') }}
        restore-keys: |
          grok-zh-rust-content-v1-zh-dev-${{ runner.os }}-${{ runner.arch }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ env.TARGET }}-release-dist-${{ hashFiles('.github/scripts/windows-rust-cache.py', '.github/scripts/rust-cache-wrapper.rs', '.github/actions/setup-windows-rust-cache/action.yml', 'Cargo.lock') }}

    - name: 启用可选 Rust 内容缓存
      id: activate
      if: steps.prepare.outputs.prepared == 'true'
      shell: pwsh
      run: python .github/scripts/windows-rust-cache.py activate
