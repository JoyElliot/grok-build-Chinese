[package]
license = "Apache-2.0"
name = "xai-grok-update"
version = "0.1.220-alpha.4"
edition.workspace = true

[features]
community-build = ["dep:tar"]

[dependencies]
dunce = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
flate2 = { workspace = true }
indicatif = { workspace = true }
reqwest = { workspace = true }
xai-grok-extra-ca = { workspace = true }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true, features = ["serde"] }
tar = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "process", "io-util", "macros", "time", "signal", "sync"] }
tracing = { workspace = true }
url = { workspace = true }
xai-dirs = { workspace = true }
xai-grok-login = { workspace = true }
xai-grok-shell = { workspace = true }
xai-grok-telemetry = { workspace = true }
xai-grok-tools = { workspace = true }
xai-grok-version = { workspace = true }
xai-grok-product = { path = "../xai-grok-product" }
zstd = { workspace = true }
sha2 = { workspace = true }
xai-tty-utils = { workspace = true }
# MinGit archive extraction. Not `workspace = true`: the workspace pin has
# default features on (aes/bzip2/lzma/zstd); MinGit entries are only deflated.
zip = { version = "3", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = { workspace = true }

[dev-dependencies]
semver = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true, features = ["serde"] }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "test-util"] }
wiremock = { workspace = true }
